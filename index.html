<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap');

  /* Register --accent as a real <color> so it can be transitioned */
  @property --accent {
    syntax: '<color>';
    inherits: true;
    initial-value: #22b573;
  }

  :root {
    --ink: #0d3b5c;
    --ink-soft: #3f6a88;

    --accent: #22b573;
    --accent-hi: color-mix(in srgb, var(--accent) 55%, #fff);
    --accent-lo: color-mix(in srgb, var(--accent) 72%, #04243c);
    --accent-ink: color-mix(in srgb, var(--accent) 55%, #05223a);

    --correct-hi: #5fe08a;
    --correct-lo: #14933f;
    --present-hi: #ffe27a;
    --present-lo: #f2a900;
    --absent-hi: #9db6c9;
    --absent-lo: #6b869c;

    /* Glossy highlight laid over any coloured gel */
    --gloss: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,0) 51%);

    /* No --accent transition: colours are randomised per level and must snap
       in step with the canvas pipes, which repaint immediately. */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: linear-gradient(180deg, #4db8f2 0%, #8fd8fb 38%, #d6f3ff 72%, #e9fbff 100%) fixed;
    color: var(--ink);
    font-family: 'Nunito Sans', 'Segoe UI', 'Frutiger', 'Trebuchet MS', sans-serif;
    font-size: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px 120px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Sky scenery ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .sun {
    position: absolute;
    top: -38vmax;
    left: 50%;
    width: 90vmax;
    height: 90vmax;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,.4) 22%, rgba(255,255,255,0) 58%);
  }
  .cloud {
    position: absolute;
    width: 320px;
    height: 120px;
    background:
      radial-gradient(70px 42px at 26% 62%, #fff 55%, transparent 100%),
      radial-gradient(80px 58px at 50% 44%, #fff 55%, transparent 100%),
      radial-gradient(64px 40px at 76% 64%, #fff 55%, transparent 100%);
    filter: blur(5px);
    opacity: .85;
  }
  .cloud.c1 { top: 9vh;  left: -60px; }
  .cloud.c2 { top: 26vh; right: -80px; transform: scale(1.3); opacity: .7; }
  .cloud.c3 { top: 52vh; left: 8vw;   transform: scale(.8);  opacity: .6; }

  .hill {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(180deg, #b5f283 0%, #4fc25a 45%, #1f8f3e 100%);
    box-shadow: inset 0 14px 30px rgba(255,255,255,.45);
  }
  .hill.h1 { bottom: -22vh; left: -25vw; width: 90vw;  height: 44vh; }
  .hill.h2 { bottom: -26vh; right: -30vw; width: 110vw; height: 42vh;
             background: linear-gradient(180deg, #8de86a 0%, #36b24d 50%, #1a8238 100%); }

  .bubble {
    position: absolute;
    bottom: -90px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.85);
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 55%, rgba(120,215,255,.35) 100%);
    box-shadow: inset 0 -8px 14px rgba(255,255,255,.4), 0 4px 14px rgba(30,140,220,.18);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise {
    to { transform: translate(24px, -118vh); }
  }

  /* ---------- Glass card ---------- */
  .app {
    width: min(880px, 100%);
    position: relative;
    z-index: 1;
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,.64), rgba(255,255,255,.36) 24%, rgba(255,255,255,.42));
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      0 30px 60px -22px rgba(8, 80, 140, .5),
      0 0 0 6px rgba(255,255,255,.2),
      inset 0 1px 0 #fff,
      inset 0 -3px 10px rgba(30,140,220,.16),
      0 0 90px -14px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .app::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 130px;
    border-radius: 32px 32px 50% 50% / 32px 32px 44px 44px;
    background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0));
    pointer-events: none;
  }

  .window-body { position: relative; padding: 30px 30px 32px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 12px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-text { text-align: left; }

  .orb {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    background:
      radial-gradient(circle at 50% 125%, var(--accent-hi), transparent 62%),
      linear-gradient(180deg, var(--accent-hi), var(--accent) 48%, var(--accent-lo));
    box-shadow:
      0 10px 20px -6px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 -7px 12px rgba(255,255,255,.35),
      inset 0 0 0 1px rgba(255,255,255,.65);
    color: #fff;
    font: 700 2.15rem/1 Georgia, 'Times New Roman', serif;
    text-shadow: 0 1px 3px rgba(0,30,60,.45);
  }
  .orb::after {
    content: '';
    position: absolute;
    top: 5%; left: 14%; right: 14%;
    height: 46%;
    border-radius: 50% / 62%;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.08));
  }
  .orb span { position: relative; z-index: 1; margin-top: 4px; }

  h1 {
    margin: 0;
    font-size: 2.9rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1.05;
    color: var(--ink);
    text-shadow: 0 1px 0 #fff, 0 6px 20px rgba(255,255,255,.8);
  }
  .sub {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 1.02rem;
    font-weight: 600;
  }

  /* ---------- Difficulty panel ---------- */
  .difficulty {
    margin: 24px auto 6px;
    max-width: 620px;
    padding: 14px 22px 16px;
    border-radius: 22px;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -10px 18px -10px rgba(30,140,220,.2),
      0 10px 20px -12px rgba(8,80,140,.4);
  }
  .diff-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .diff-header .label { font-size: .95rem; font-weight: 700; color: var(--ink-soft); }
  .diff-header .value { font-size: 1.2rem; font-weight: 800; color: var(--accent-ink); }

  /* Glossy slider: the filled part follows --p (0 to 1), set in JS */
  input[type="range"].diff-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 30px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    --p: .25;
  }
  input[type="range"].diff-slider::-webkit-slider-runnable-track {
    height: 16px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo)) 0 0 / calc(14px + (100% - 28px) * var(--p)) 100% no-repeat,
      linear-gradient(180deg, rgba(10,70,120,.28), rgba(255,255,255,.7));
    box-shadow: inset 0 2px 4px rgba(5,50,90,.4), 0 1px 0 rgba(255,255,255,.95);
  }
  input[type="range"].diff-slider::-moz-range-track {
    height: 16px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo)) 0 0 / calc(14px + (100% - 28px) * var(--p)) 100% no-repeat,
      linear-gradient(180deg, rgba(10,70,120,.28), rgba(255,255,255,.7));
    box-shadow: inset 0 2px 4px rgba(5,50,90,.4), 0 1px 0 rgba(255,255,255,.95);
  }
  input[type="range"].diff-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 30px;
    height: 30px;
    margin-top: -7px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: linear-gradient(180deg, #fff 0%, #e3f4ff 48%, var(--accent-hi) 52%, #fff 100%);
    box-shadow: 0 4px 10px rgba(5,60,110,.4), inset 0 0 0 1px rgba(255,255,255,.9);
    cursor: pointer;
  }
  input[type="range"].diff-slider::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: linear-gradient(180deg, #fff 0%, #e3f4ff 48%, var(--accent-hi) 52%, #fff 100%);
    box-shadow: 0 4px 10px rgba(5,60,110,.4), inset 0 0 0 1px rgba(255,255,255,.9);
    cursor: pointer;
  }
  .diff-ticks {
    display: flex;
    justify-content: space-between;
    font-size: .82rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .diff-desc {
    margin-top: 10px;
    font-size: .95rem;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
    min-height: 1.3em;
  }

  /* ---------- Badge ---------- */
  .badge {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 22px;
    border-radius: 999px;
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    border: 1px solid color-mix(in srgb, var(--accent) 65%, #000);
    color: #fff;
    font-weight: 700;
    font-size: .95rem;
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
    box-shadow:
      0 8px 16px -8px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  /* ---------- Buttons ---------- */
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 11px 24px;
    border-radius: 999px;
    color: var(--ink);
    background: var(--gloss), linear-gradient(180deg, #ffffff, #cdeaff);
    border: 1px solid rgba(40,130,200,.55);
    box-shadow: 0 6px 12px -6px rgba(8,80,140,.55), inset 0 1px 0 #fff;
    cursor: pointer;
    user-select: none;
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.07) saturate(1.1); }
  button:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 6px -3px rgba(8,80,140,.55), inset 0 2px 4px rgba(8,80,140,.2);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.primary {
    color: #fff;
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    border-color: color-mix(in srgb, var(--accent) 65%, #000);
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
    box-shadow:
      0 8px 16px -8px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  :is(button, input[type="range"]):focus-visible {
    outline: 3px solid var(--accent-ink);
    outline-offset: 3px;
  }

  /* ---------- Status / hints ---------- */
  .status {
    position: relative;
    margin-top: 20px;
    padding: 14px 20px 14px 52px;
    border-radius: 20px;
    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, 0 8px 18px -12px rgba(8,80,140,.5);
    min-height: 3.1em;
    line-height: 1.5;
    font-weight: 600;
    color: var(--ink);
    transition: background .4s;
  }
  .status::before {
    content: '';
    position: absolute;
    left: 18px; top: 50%;
    width: 20px; height: 20px;
    transform: translateY(-50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%),
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo));
    box-shadow: 0 3px 8px -2px color-mix(in srgb, var(--accent) 80%, #000), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .status.win  { background: rgba(214,255,228,.8); }
  .status.lose { background: rgba(255,222,229,.82); }
  .status.win::before {
    background: radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%), linear-gradient(180deg, var(--correct-hi), var(--correct-lo));
  }
  .status.lose::before {
    background: radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%), linear-gradient(180deg, #ff8fa3, #d2284a);
  }
  .status a {
    color: var(--accent-ink);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .footer-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  /* ---------- Board ---------- */
  .board-panel {
    margin: 22px auto 0;
    max-width: 780px;
    padding: 18px 12px;
    border-radius: 22px;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -10px 18px -10px rgba(30,140,220,.2),
      0 10px 20px -12px rgba(8,80,140,.4);
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .board {
    --tile: 60px;
    --gap: 4px;
    --cols: 5;
    padding: calc(var(--tile) * .8) 0 calc(var(--tile) * 1.0);
  }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--tile));
    grid-auto-rows: var(--tile);
    gap: var(--gap);
  }

  .cell {
    position: relative;
    display: block;
    width: var(--tile);
    height: var(--tile);
    padding: 0;
    overflow: hidden;
    border-radius: calc(var(--tile) * .2);
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.5));
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 -4px 8px rgba(30,120,200,.16), 0 4px 9px -4px rgba(8,80,140,.45);
    cursor: pointer;
  }
  .cell.fixed { cursor: default; }
  .cell.locked {
    background: linear-gradient(180deg, rgba(238,245,251,.95), rgba(188,206,222,.72));
    cursor: not-allowed;
  }
  .cell.hole {
    cursor: default;
    background: radial-gradient(circle at 50% 38%, rgba(6,50,100,.58), rgba(6,60,120,.28));
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: inset 0 6px 14px rgba(0,30,70,.55), inset 0 -2px 6px rgba(255,255,255,.25);
  }
  .cell.nope { animation: nope .25s; }
  @keyframes nope { 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
  .board.busy .cell { cursor: progress; }

  .pipe {
    display: block;
    width: 100%;
    height: 100%;
    transition: transform .24s cubic-bezier(.3, 1.35, .5, 1);
  }
  .pipe g { fill: none; stroke-linecap: butt; }
  .pipe .edge  { stroke: var(--accent-lo); stroke-opacity: .6; stroke-width: 34; }
  .pipe .mid   { stroke: var(--accent-hi); stroke-opacity: .72; stroke-width: 26; }
  .pipe .shine { stroke: #fff; stroke-opacity: .85; stroke-width: 8; }
  .cell.locked .edge { stroke: #5d7487; }
  .cell.locked .mid  { stroke: #b4c5d3; }

  /* ---------- Solved-path glow (placed AFTER locked rules so it wins) ---------- */
  .cell.solved {
    background: linear-gradient(180deg, rgba(214,255,228,.95), rgba(150,240,180,.62));
    border-color: rgba(120,240,170,.95);
    box-shadow:
      0 0 18px 3px rgba(60,230,130,.75),
      0 0 34px 8px rgba(60,230,130,.32),
      inset 0 -4px 8px rgba(30,120,200,.16);
    animation: solvedPop .55s cubic-bezier(.34, 1.56, .64, 1);
    z-index: 2;
  }
  .cell.solved .pipe .edge  { stroke: var(--correct-lo); stroke-opacity: .85; }
  .cell.solved .pipe .mid   { stroke: var(--correct-hi); stroke-opacity: .95; }
  .cell.solved .pipe .shine { stroke: #fff; }
  .cell.solved .lock { background: rgba(220,255,235,.95); }
  @keyframes solvedPop {
    0%   { scale: 1; }
    45%  { scale: 1.18; }
    100% { scale: 1; }
  }

  .lock {
    position: absolute;
    right: 3px; bottom: 3px;
    width: 42%;
    max-width: 20px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 1px 3px rgba(8,60,110,.35);
  }
  .lock svg { width: 68%; height: 68%; }

  .chute {
    position: absolute;
    left: calc(var(--tile) * .28);
    top: calc(var(--tile) * -.72);
    width: calc(var(--tile) * .44);
    height: calc(var(--tile) * .72);
    border-radius: 999px 999px 6px 6px / 14px 14px 6px 6px;
    background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,255,255,.35) 50%, rgba(255,255,255,.85));
    border: 1px solid color-mix(in srgb, var(--accent) 55%, #fff);
    box-shadow: 0 6px 12px -6px rgba(8,80,140,.5), inset 0 -6px 10px -4px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .cup {
    position: absolute;
    top: calc(100% + 6px);
    width: calc(var(--tile) * .84);
    height: calc(var(--tile) * .62);
    border-radius: 6px 6px calc(var(--tile) * .34) calc(var(--tile) * .34);
    background: var(--gloss), linear-gradient(180deg, #8cf0b0, #1fae5a);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 0 22px 4px rgba(60,230,130,.5), inset 0 -6px 10px rgba(0,80,30,.25);
  }
  .cup.hit { animation: cupHit .6s; }
  @keyframes cupHit { 40% { scale: 1.18; box-shadow: 0 0 40px 12px rgba(60,230,130,.85), inset 0 -6px 10px rgba(0,80,30,.25); } }

  .marble {
    --m: 26px;
    position: absolute;
    left: 0; top: 0;
    width: var(--m);
    height: var(--m);
    display: none;
    z-index: 5;
    pointer-events: none;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.85);
    background:
      radial-gradient(circle at 32% 28%, #fff 0 10%, rgba(255,255,255,0) 30%),
      radial-gradient(circle at 50% 62%, var(--accent-hi), var(--accent) 55%, var(--accent-lo));
    box-shadow: 0 5px 9px rgba(5,60,110,.45), inset 0 -3px 6px rgba(255,255,255,.35);
  }

  /* ---------- Stats ---------- */
  .stats { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .stat {
    padding: 7px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,.66);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, 0 6px 12px -8px rgba(8,80,140,.5);
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stat span { color: var(--ink-soft); font-weight: 700; margin-right: 8px; }

  @media (max-width: 620px) {
    .app { border-radius: 26px; }
    .window-body { padding: 22px 14px 24px; }
    .orb { width: 56px; height: 56px; font-size: 1.8rem; }
    h1 { font-size: 2.1rem; }
    .difficulty { padding: 12px 14px 14px; }
    .board-panel { padding: 14px 6px; }
    button { padding: 11px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; bottom: 0; transform: translateY(var(--ry, -40vh)); }
    .pipe, button, .status { transition: none; }
    .cell.nope, .cup.hit, .cell.solved { animation: none; }
  }

/* ---------- dark abstract camera redesign ---------- */
:root { --ink:#e8f4d0; --ink-soft:#9aa98a; --accent:#a5d84b; --accent-hi:#e5ff9b; --accent-lo:#42651c; --accent-ink:#d7ff85; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  display:block; padding:0; min-height:100%; overflow:hidden;
  background:#030503; color:#e9f4d8; font-family:Arial, Helvetica, sans-serif;
}
.sky { display:none; }
.app { position:static; width:100%; max-width:none; border:0; border-radius:0; background:none; box-shadow:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
.app::before { display:none; }
.window-body { padding:0; }
header { position:fixed; z-index:20; top:18px; left:20px; right:20px; margin:0; text-align:left; pointer-events:none; }
.brand { display:none; }
.difficulty {
  position:fixed; z-index:31; top:62px; left:12px; width:min(290px, calc(100vw - 24px));
  margin:0; padding:15px; max-width:none; border:0; border-radius:0 0 8px 8px;
  background:#090d07; box-shadow:none; text-align:left;
  transform:translateX(calc(-100% - 16px)); transition:transform .25s ease;
  pointer-events:auto; touch-action:pan-y;
}
.difficulty.open { transform:translateX(0); pointer-events:auto; }
/* The header is decorative, but the sliding controls must remain interactive. */

<script>
const DR = [-1, 0, 1, 0];   // sides: 0 top, 1 right, 2 bottom, 3 left
const DC = [0, 1, 0, -1];
const G = 0;                // tile spacing: zero to match the angular, seamless board

// The board starts with value 4 (2×2). Each victory adds one point;
// all points above the four-cell base are randomly assigned to height or width.
let boardValue = 4;

/* Chill mode: only offered on the very first board (value 4). When on, the
   combo window becomes infinite, which short-circuits every expiry check in
   one place — startClock's tick, clearCombo's timer, and finishRun's
   "did we beat the clock?" test all consult comboWindowMs(). */
let chillMode = false;

function comboWindowMs() {
  if (chillMode) return Infinity;
  return 60000 + Math.max(0, boardValue - 4) * 2000;
}
function configForValue(value) {
  const extra = Math.max(0, value - 4);
  const extraRows = rnd(extra + 1);
  const rows = 2 + extraRows;
  const cols = 2 + extra - extraRows;
  const area = rows * cols;
  const holeRadii = [];
  if (value >= 7) holeRadii.push(0.5);
  if (value >= 10) holeRadii.push(1);
  if (value >= 15) holeRadii.push(1.5);
  if (value >= 22) holeRadii.push(2);
  if (value >= 32) holeRadii.push(3);
  if (value >= 48) holeRadii.push(4);
  if (value >= 70) holeRadii.push(5);
  const locked = value < 7 ? 0 : Math.min(Math.floor(area * Math.min(0.22, (value - 5) * 0.006)), Math.max(0, area - 5));
  return { name: 'Value ' + value, value, rows, cols, holeRadii, locked,
    pathLen: Math.max(3, Math.min(area, Math.round((rows + cols) * (0.8 + Math.min(value, 40) / 40)))) };
}
const COLORS = ['#22b573', '#1e90e6', '#ee9a00', '#f0622a', '#e5365f'];
const badge      = document.getElementById('badge');
const levelRecap = document.getElementById('levelRecap');
const panel      = document.getElementById('panel');
const board      = document.getElementById('board');
const gridEl     = document.getElementById('grid');
const chillToggle= document.getElementById('chillToggle');
const pipeCanvas = document.createElement('canvas'); pipeCanvas.id = 'pipeCanvas';
const pipeCtx = pipeCanvas.getContext('2d', { alpha: true, desynchronized: true });
let canvasMode = false;
const timeEl     = document.getElementById('timeEl');
const marblesEl  = document.getElementById('marblesEl');
const dropBtn    = document.getElementById('dropBtn');
const newBtn     = document.getElementById('newBtn');
const speedBtn   = document.getElementById('speedBtn');
const comboBar   = document.getElementById('comboBar');
const comboText  = document.getElementById('comboText');
const comboFill  = document.getElementById('comboFill');
let comboCount = 0, frenzy = false, speedMultiplier = 1, frenzyTimer = null, speedBoostTimer = null, speedBoostUntil = 0;
const status     = document.getElementById('status');

const chute  = Object.assign(document.createElement('div'), { className: 'chute' });
const cup    = Object.assign(document.createElement('div'), { className: 'cup' });
const marble = Object.assign(document.createElement('div'), { className: 'marble' });

let level = null, T = 60, M = 26;
let lastRunPath = [];
let busy = false, won = false, marbles = 0, runId = 0;
let solvedTimeouts = [];

/* ---------- helpers ---------- */
const rnd = n => Math.floor(Math.random() * n);
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h * 12) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
  };
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}

/* ---------- grid spin state ----------
   Once the combo reaches COMBO_MUSIC_AT the whole maze rotates about its own
   centre. SPIN_DEG_PER_SEC is the net result of the earlier "3× slower, then
   double it" tuning — 2/3 of the original 36°/s, i.e. one turn every 15s.
   spinDir is a coin-toss sign that flips on every level win, so long combo
   runs alternate between clockwise and anticlockwise. */
const SPIN_DEG_PER_SEC = 5;
let spinAngle = 0, spinSpeed = 0, spinLastSet = null;
let spinDir = 1;

/* ---------- tile logic ---------- */
function openings(cell, rot) {
  if (cell.type === 'cross') return [0, 1, 2, 3];
  if (cell.type === 'straight') return rot % 2 === 0 ? [0, 2] : [1, 3];
  return [rot % 4, (rot + 1) % 4];            // curve: rot k joins sides k and k+1
}

// Follows a marble from the top of the start tile. Pure function of the board.
function simulate(lv, useSolution) {
  const { rows, cols, cells, target } = lv;
  const seen = new Set(), steps = [];
  let r = lv.start.r, c = lv.start.c, enter = 0;
  for (;;) {
    const cell = cells[r][c];
    const key = r + ',' + c + ',' + enter;
    if (seen.has(key)) return { steps, end: { kind: 'loop', r, c, enter } };
    seen.add(key);
    const open = openings(cell, useSolution ? cell.solRot : cell.rot);
    if (!open.includes(enter)) return { steps, end: { kind: 'blocked', r, c, enter } };
    const exit = cell.type === 'cross' ? (enter + 2) % 4 : open.find(s => s !== enter);
    steps.push({ r, c, enter, exit });
    const nr = r + DR[exit], nc = c + DC[exit];
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) {
      const win = exit === 2 && r === rows - 1 && c === target;
      return { steps, end: { kind: win ? 'win' : 'fall', r, c, exit } };
    }
    if (cells[nr][nc].hole) return { steps, end: { kind: 'hole', r: nr, c: nc, enter: (exit + 2) % 4 } };
    r = nr; c = nc; enter = (exit + 2) % 4;
  }
}

/* ---------- level generation ---------- */
function makeHoles(cfg, target, start) {
  const { rows, cols } = cfg;
  const holes = Array.from({ length: rows }, () => Array(cols).fill(false));
  for (const rad of cfg.holeRadii) {
    const cr = rnd(rows), cc = rnd(cols);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (Math.hypot(r - cr, c - cc) > rad) continue;
      if ((r === start.r && c === start.c) || (r === rows - 1 && c === target)) continue;
      holes[r][c] = true;
    }
  }
  return holes;
}

function reachable(holes, rows, cols, target, start) {
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
  const q = [[start.r, start.c]]; seen[start.r][start.c] = true;
  while (q.length) {
    const [r, c] = q.pop();
    for (let d = 0; d < 4; d++) {
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || holes[nr][nc] || seen[nr][nc]) continue;
      seen[nr][nc] = true; q.push([nr, nc]);
    }
  }
  return seen[rows - 1][target];
}

// Random depth-first maze; the tree path from start to goal is a winding route.
function treePath(holes, rows, cols, target, start) {
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
  const parent = new Map(), stack = [[start.r, start.c]];
  seen[start.r][start.c] = true;
  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const opts = [];
    for (let d = 0; d < 4; d++) {
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || holes[nr][nc] || seen[nr][nc]) continue;
      opts.push([nr, nc]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nr, nc] = opts[rnd(opts.length)];
    seen[nr][nc] = true;
    parent.set(nr * cols + nc, r * cols + c);
    stack.push([nr, nc]);
  }
  const startKey = start.r * cols + start.c;
  const path = [];
  let cur = (rows - 1) * cols + target;
  while (cur !== startKey) { path.push([Math.floor(cur / cols), cur % cols]); cur = parent.get(cur); }
  path.push([start.r, start.c]);
  return path.reverse();
}

function dirBetween(a, b) {
  for (let d = 0; d < 4; d++) if (a[0] + DR[d] === b[0] && a[1] + DC[d] === b[1]) return d;
  return -1;
}

function assemble(cfg, holes, target, start, path) {
  const { rows, cols } = cfg;
  const cells = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => {
    const roll = Math.random();
    return {
      hole: holes[r][c], onPath: false, locked: false, deg: 0,
      type: roll < .45 ? 'curve' : roll < .8 ? 'straight' : 'cross',
      rot: rnd(4), solRot: 0,
    };
  }));

  // 1. Lay the guaranteed route.
  for (let i = 0; i < path.length; i++) {
    const [r, c] = path[i], cell = cells[r][c];
    const enter = i === 0 ? 0 : (dirBetween(path[i - 1], path[i]) + 2) % 4;
    const exit  = i === path.length - 1 ? 2 : dirBetween(path[i], path[i + 1]);
    if (enter === exit || exit < 0) return null;
    cell.onPath = true;
    if ((enter + 2) % 4 === exit) {
      cell.type = Math.random() < .22 ? 'cross' : 'straight';
      cell.solRot = cell.type === 'straight' ? (enter % 2 === 0 ? 0 : 1) : 0;
    } else {
      cell.type = 'curve';
      cell.solRot = (enter + 1) % 4 === exit ? enter : exit;
    }
    cell.rot = cell.solRot;
  }

  // 2. Lock some rotatable tiles (route tiles stay in their correct pose).
  const lockable = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cell = cells[r][c];
    if (!cell.hole && cell.type !== 'cross') lockable.push(cell);
  }
  for (let i = lockable.length - 1; i > 0; i--) { const j = rnd(i + 1); [lockable[i], lockable[j]] = [lockable[j], lockable[i]]; }
  lockable.slice(0, cfg.locked).forEach(cell => { cell.locked = true; });

  // 3. Scramble the unlocked route tiles so the board starts unsolved.
  const eligible = [];
  for (const [r, c] of path) {
    const cell = cells[r][c];
    if (!cell.locked && cell.type !== 'cross') eligible.push(cell);
  }
  if (eligible.length < Math.min(3, path.length)) return null;
  const wrongize = cell => {
    cell.rot = cell.type === 'straight' ? cell.solRot ^ 1 : (cell.solRot + 1 + rnd(3)) % 4;
  };
  eligible.forEach(cell => { if (Math.random() < .88) wrongize(cell); });
  const isWrong = cell => openings(cell, cell.rot).join() !== openings(cell, cell.solRot).join()
    && !(cell.type === 'straight' && cell.rot % 2 === cell.solRot % 2);
  let wrong = eligible.filter(isWrong).length;
  for (const cell of eligible) {
    if (wrong >= Math.min(3, eligible.length)) break;
    if (!isWrong(cell)) { wrongize(cell); wrong++; }
  }
  cells.forEach(row => row.forEach(cell => { cell.deg = cell.rot * 90; }));

  let holeCells = 0, lockedCells = 0;
  cells.forEach(row => row.forEach(cell => { if (cell.hole) holeCells++; if (cell.locked) lockedCells++; }));
  const lv = { rows, cols, target, start, cells, path, holeCells, lockedCells, cfg };

  // 4. Guarantees: solvable, and not already solved.
  if (simulate(lv, true).end.kind !== 'win') return null;
  if (simulate(lv, false).end.kind === 'win') return null;
  return lv;
}

function generateLevel(cfg) {
  const { rows, cols } = cfg;
  const area = rows * cols;
  // Cap inner path samples for huge grids so generation stays snappy.
  const samples = area >= 2500 ? 3 : area > 400 ? 8 : Math.max(6, Math.min(24, Math.round(3000 / Math.max(1, area))));
  const attempts = area >= 2500 ? 28 : area > 400 ? 70 : 220;
  for (let attempt = 0; attempt < attempts; attempt++) {
    const start  = { r: 0, c: rnd(cols) };   // random drop column
    const target = rnd(cols);
    const holes = attempt < Math.floor(attempts * 0.75)
      ? makeHoles(cfg, target, start)
      : Array.from({ length: rows }, () => Array(cols).fill(false));
    let hc = 0;
    holes.forEach(row => row.forEach(v => { if (v) hc++; }));
    if (hc > area * 0.4) continue;
    if (!reachable(holes, rows, cols, target, start)) continue;
    let best = null, bestDiff = Infinity;
    for (let k = 0; k < samples; k++) {
      const p = treePath(holes, rows, cols, target, start);
      const diff = Math.abs(p.length - cfg.pathLen) + Math.random() * .5;
      if (diff < bestDiff) { best = p; bestDiff = diff; }
    }
    const lv = assemble(cfg, holes, target, start, best);
    if (lv) return lv;
  }
  throw new Error('Could not generate a level');
}

/* ---------- rendering ---------- */
function pipeSvg(type) {
  // One crisp, angular stroke per pipe: fewer SVG nodes and no curved elbows.
  const d = type === 'straight' ? 'M50 0V100'
          : type === 'curve'    ? 'M50 0V50H100'
          : 'M50 0V100 M0 50H100';
  return '<svg class="pipe" viewBox="0 0 100 100" aria-hidden="true"><path class="pipe-line" d="' + d + '"/></svg>';
}
function buildBoard() {
  canvasMode = true;
  if (canvasMode) {
    // A single canvas replaces thousands of buttons and SVG nodes on the largest boards.
    gridEl.replaceChildren();
    if (chute.parentNode !== board) board.append(chute, cup, marble);
    gridEl.style.display = 'none';
    board.style.width = (level.cols * T) + 'px';
    board.style.height = (level.rows * T) + 'px';
    pipeCanvas.width = level.cols * T;
    pipeCanvas.height = level.rows * T;
    pipeCanvas.style.width = pipeCanvas.width + 'px';
    pipeCanvas.style.height = pipeCanvas.height + 'px';
    board.appendChild(pipeCanvas);
    pipeCanvas.style.display = 'block';
    level.cells.forEach((row,r) => row.forEach((cell,c) => { cell.el = null; }));
    fit(); drawCanvasBoard();
    return;
  }
  pipeCanvas.style.display = 'none';
  if (chute.parentNode !== gridEl) gridEl.append(chute, cup, marble);
  gridEl.style.display = 'grid';
  board.style.width = 'max-content'; board.style.height = 'auto';
  const nodes = [];
  level.cells.forEach((row, r) => row.forEach((cell, c) => {
    let el;
    if (cell.hole) { el = document.createElement('div'); el.className = 'cell hole'; }
    else {
      el = document.createElement('button');
      el.className = 'cell' + (cell.locked ? ' locked' : '') + (cell.type === 'cross' ? ' fixed' : '');
      el.dataset.r = r; el.dataset.c = c;
      el.setAttribute('aria-label', 'Row ' + (r + 1) + ', column ' + (c + 1) + ', ' + cell.type + (cell.locked ? ', locked' : cell.type === 'cross' ? ', fixed' : ', tap to rotate'));
      el.innerHTML = pipeSvg(cell.type);
      if (cell.type !== 'cross') el.firstChild.style.transform = 'rotate(' + cell.deg + 'deg)';
    }
    cell.el = el; nodes.push(el);
  }));
  board.style.setProperty('--cols', level.cols);
  board.style.setProperty('--gap', G + 'px');
  gridEl.replaceChildren(...nodes, chute, cup, marble);
  fit();
}

function drawCanvasBoard() {
  if (!canvasMode || !level) return;
  const ctx = pipeCtx, dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const w = level.cols * T, h = level.rows * T;
  if (pipeCanvas.width !== Math.round(w*dpr) || pipeCanvas.height !== Math.round(h*dpr)) {
    pipeCanvas.width = Math.round(w*dpr); pipeCanvas.height = Math.round(h*dpr);
    pipeCanvas.style.width = w+'px'; pipeCanvas.style.height = h+'px';
  }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ee9a00';
  const solved = new Set(lastRunPath.map(([r,c])=>r+','+c));
  ctx.lineWidth = Math.max(2,T*.24); ctx.lineCap='butt'; ctx.lineJoin='miter';
  level.cells.forEach((row,r)=>row.forEach((cell,c)=>{
    if(cell.hole) return;
    const x=c*T, y=r*T, cx=x+T/2, cy=y+T/2;
    ctx.strokeStyle = solved.has(r+','+c) && won ? '#fff' : cell.locked ? '#777d77' : accent;
    ctx.beginPath();
    if(cell.type==='cross') { ctx.moveTo(cx, y); ctx.lineTo(cx,y+T); ctx.moveTo(x,cy); ctx.lineTo(x+T,cy); }
    else if(cell.type==='straight') {
      if(cell.rot%2===0){ctx.moveTo(cx,y);ctx.lineTo(cx,y+T);} else {ctx.moveTo(x,cy);ctx.lineTo(x+T,cy);}
    } else {
      const a=cell.rot%4, b=(a+1)%4;
      const pos=d=>({x:cx+DC[d]*T/2,y:cy+DR[d]*T/2});
      const A=pos(a),B=pos(b); ctx.moveTo(A.x,A.y); ctx.lineTo(cx,cy); ctx.lineTo(B.x,B.y);
    }
    ctx.stroke();
  }));
}

function fit() {
  if (!level) return;
  // Keep the maze as a stable world; camera controls change the view, not its geometry.
  T = window.innerWidth < 620 ? 44 : 60;
  M = 18 / zoom; // counter-scale in world space so it stays ~18 screen pixels at every zoom
  board.style.setProperty('--tile', T + 'px');
  if (canvasMode) { board.style.width=(level.cols*T)+'px'; board.style.height=(level.rows*T)+'px'; drawCanvasBoard(); }
  marble.style.setProperty('--m', M + 'px');
  chute.style.left = (level.start.c * (T + G) + (T - T * .44) / 2) + 'px';
  cup.style.left = (level.target * (T + G) + T * .08) + 'px';
  updateCamera();
}
window.addEventListener('resize', () => { if (!busy) fit(); });

/* ---------- camera / floating controls ---------- */
let cameraX = 0, cameraY = 0, zoom = 1, drag = null, dragged = false;
function updateCamera() {
  board.style.setProperty('--pan-x', cameraX + 'px');
  board.style.setProperty('--pan-y', cameraY + 'px');
  board.style.setProperty('--zoom', zoom);
  M = 18 / zoom;
  marble.style.setProperty('--m', M + 'px');
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = Math.round(zoom * 100) + '%';
}
function changeZoom(mult) { zoom = Math.max(.15, Math.min(3.5, zoom * mult)); updateCamera(); }
document.getElementById('zoomIn').addEventListener('click', () => changeZoom(1.2));
document.getElementById('zoomOut').addEventListener('click', () => changeZoom(1/1.2));
document.getElementById('resetCamera').addEventListener('click', () => { cameraX=0; cameraY=0; zoom=1; updateCamera(); });
const activePointers = new Map();
let pinch = null;
const pointDistance = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const pointMid = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
panel.addEventListener('pointerdown', e => {
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  try { panel.setPointerCapture(e.pointerId); } catch (_) {}
  if (activePointers.size === 2) {
    const pts=[...activePointers.values()], mid=pointMid(pts[0],pts[1]);
    pinch={distance:Math.max(1,pointDistance(pts[0],pts[1])), zoom, x:mid.x, y:mid.y, cx:cameraX, cy:cameraY};
    drag=null; dragged=true;
  } else if (activePointers.size === 1) {
    drag={x:e.clientX,y:e.clientY,cx:cameraX,cy:cameraY,id:e.pointerId};
    dragged=false;
  }
});
panel.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (activePointers.size >= 2 && pinch) {
    const pts=[...activePointers.values()].slice(0,2), mid=pointMid(pts[0],pts[1]);
    const oldZoom=zoom;
    zoom=Math.max(.15,Math.min(3.5,pinch.zoom*pointDistance(pts[0],pts[1])/pinch.distance));
    const ratio=zoom/oldZoom;
    const fx=pinch.x-innerWidth/2, fy=pinch.y-innerHeight/2;
    cameraX=fx-(fx-pinch.cx)*ratio + (mid.x-pinch.x);
    cameraY=fy-(fy-pinch.cy)*ratio + (mid.y-pinch.y);
    updateCamera(); panel.classList.add('dragging'); return;
  }
  if (!drag || drag.id !== e.pointerId) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if (Math.hypot(dx,dy)>5) { dragged=true; panel.classList.add('dragging'); }
  if (dragged) { cameraX=drag.cx+dx; cameraY=drag.cy+dy; updateCamera(); }
});
function stopDrag(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinch=null;
  if (activePointers.size === 0) {
    drag=null; panel.classList.remove('dragging');
    if (dragged) { suppressTileClick=true; setTimeout(()=>{suppressTileClick=false;},80); }
    dragged=false;
  } else if (activePointers.size === 1) {
    const [id,pt]=[...activePointers.entries()][0];
    drag={x:pt.x,y:pt.y,cx:cameraX,cy:cameraY,id};
  }
}
panel.addEventListener('pointerup', stopDrag);
panel.addEventListener('pointercancel', stopDrag);
panel.addEventListener('wheel', e => {
  e.preventDefault(); changeZoom(e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});
let suppressTileClick=false;

/* ---------- clock ---------- */
let startAt = null, timerId = null;
function startClock() {
  if (startAt !== null) return;
  startAt = performance.now();
  timerId = setInterval(() => {
    const elapsed = performance.now() - startAt;
    timeEl.textContent = fmt(elapsed);
    if (comboCount > 0) {
      const left = Math.max(0, 1 - elapsed / comboWindowMs());
      comboFill.style.transform = 'scaleX(' + left + ')';
      if (elapsed >= comboWindowMs()) clearCombo();
    }
  }, 100);
}
function stopClock() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (startAt !== null) timeEl.textContent = fmt(performance.now() - startAt);
}
function resetClock() {
  if (timerId) clearInterval(timerId);
  timerId = null; startAt = null; timeEl.textContent = '0:00';
}
function clearCombo() {
  comboCount = 0; frenzy = false;
  document.body.classList.remove('frenzy-mode');
  comboBar.classList.remove('visible');
  comboFill.style.transform = 'scaleX(0)';
  if (frenzyTimer) { clearTimeout(frenzyTimer); frenzyTimer = null; }
  stopMusic();
}

/* ---------- infinite progression ----------
   Every level rolls a brand-new accent colour rather than walking the hue
   wheel, so consecutive boards read as a fresh palette instead of a slow
   drift. Saturation and lightness still tighten with the level value, and a
   minimum hue separation stops the new colour from landing next to the old
   one. The random walk is skipped for the very first board only in the sense
   that there is no previous colour to avoid. */
const HUE_MIN_SEPARATION = 60;   // degrees of hue distance between boards
let huePos = 142;                // current accent hue (also seeds the first roll)
let accentH = 142, accentS = 64, accentL = 56;
/* Mirrors of the live accent so the starfield can build rgba() strings
   without re-parsing a computed CSS colour every frame. */

function hueDistance(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function previewDifficulty(value) {
  // Roll a new hue, re-rolling if it lands too close to the outgoing one.
  let hue = Math.random() * 360;
  for (let guard = 0; guard < 20 && hueDistance(hue, huePos) < HUE_MIN_SEPARATION; guard++) {
    hue = Math.random() * 360;
  }
  huePos = hue;
  const sat = Math.min(88, 64 + Math.floor(Math.max(0, value - 4) / 8));
  const light = Math.max(43, 56 - Math.floor(Math.max(0, value - 4) / 12));
  accentH = hue; accentS = sat; accentL = light;
  document.documentElement.style.setProperty('--accent', `hsl(${hue} ${sat}% ${light}%)`);
  document.documentElement.style.setProperty('--correct-hi', `hsl(${(hue + 42) % 360} 85% 72%)`);
  document.documentElement.style.setProperty('--correct-lo', `hsl(${(hue + 42) % 360} 72% 38%)`);
}

function newLevel() {
  document.body.classList.remove('won');
  runId++;
  busy = false; won = false; marbles = 0; lastRunPath = [];
  solvedTimeouts.forEach(clearTimeout);
  solvedTimeouts = [];
  marble.style.display = 'none';
  speedBtn.classList.remove('visible','active'); speedMultiplier = 1; speedBoostUntil = 0;
  if (speedBoostTimer) { clearTimeout(speedBoostTimer); speedBoostTimer = null; }
  speedBtn.textContent = 'Speed up »';
  if (frenzyTimer) { clearTimeout(frenzyTimer); frenzyTimer = null; }
  chute.classList.remove('victory'); cup.classList.remove('victory');
  board.classList.remove('busy');
  resetClock();
  marblesEl.textContent = '0';
  const cfg = configForValue(boardValue);
  previewDifficulty(boardValue);
  level = generateLevel(cfg);
  buildBoard();
  // Canvas pipes use a snapshot of the accent color, so repaint immediately on every level.
  drawCanvasBoard();
  cameraX = 0; cameraY = 0;
  zoom = Math.min(1, Math.max(.15, Math.min((innerWidth * .82) / (level.cols * T), (innerHeight * .72) / (level.rows * T))));
  updateCamera();
  badge.textContent = 'VALUE ' + boardValue + '  ·  ' + level.cols + ' × ' + level.rows + '  ·  ' + level.holeCells + ' HOLES  ·  ' + level.lockedCells + ' LOCKED';
  dropBtn.disabled = false;
  newBtn.classList.remove('primary');
  status.className = 'status';
  status.textContent = 'Rotate the tiles to build a route, then drop a marble.';
  // Chill mode is a first-board-only option; once value climbs past 4 it is gone.
  chillToggle.classList.toggle('hidden', boardValue !== 4);
  // A new board wipes any shooting stars still in flight.
  stars.length = 0; starSpawnAccum = 0;
  if (frenzy) { document.body.classList.add('frenzy-mode'); startClock(); }
  else document.body.classList.remove('frenzy-mode');
  // Every fresh board pops with a white flash once the combo has the music running.
  if (comboCount >= COMBO_MUSIC_AT) flashScreen();
}

chillToggle.addEventListener('click', () => {
  if (boardValue !== 4) return;      // only selectable on the initial board
  chillMode = !chillMode;
  chillToggle.setAttribute('aria-pressed', chillMode ? 'true' : 'false');
  status.className = 'status';
  status.textContent = chillMode
    ? 'Chill mode on — combos never expire.'
    : 'Chill mode off — combos expire on the timer.';
});

panel.addEventListener('click', e => {
  if (!canvasMode || !level || busy || won || dragged || suppressTileClick) return;
  const w = board.offsetWidth, h = board.offsetHeight;
  // Undo translate, scale and grid rotation to get board-local pixels.
  const px = (e.clientX - (innerWidth / 2 + cameraX)) / zoom;
  const py = (e.clientY - (innerHeight / 2 + cameraY)) / zoom;
  const th = spinAngle * Math.PI / 180;
  const cos = Math.cos(th), sin = Math.sin(th);
  const lx = w / 2 + px * cos + py * sin;
  const ly = h / 2 - px * sin + py * cos;
  const c = Math.floor(lx / T), r = Math.floor(ly / T);
  if (r < 0 || r >= level.rows || c < 0 || c >= level.cols) return;
  const cell = level.cells[r][c]; if (cell.hole) return;
  if (cell.locked || cell.type === 'cross') { status.textContent = 'That tile cannot be rotated.'; return; }
  startClock(); cell.rot = (cell.rot + 1) % 4; cell.deg = cell.rot * 90; drawCanvasBoard();
});

gridEl.addEventListener('click', (e) => {
  if (canvasMode) return;
  const btn = e.target.closest('button.cell');
  if (!btn || !level || busy || won || suppressTileClick) return;
  const cell = level.cells[+btn.dataset.r][+btn.dataset.c];
  if (cell.locked || cell.type === 'cross') {
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    return;
  }
  startClock();
  cell.rot = (cell.rot + 1) % 4;
  cell.deg += 90;
  btn.firstChild.style.transform = 'rotate(' + cell.deg + 'deg)';
});

function buildRoute(sim) {
  const P = T, pts = [];
  const center = (r, c) => ({ x: c * P + T / 2, y: r * P + T / 2 });
  const edge = (r, c, s) => {
    const o = center(r, c), h = T / 2;
    return { x: o.x + DC[s] * h, y: o.y + DR[s] * h };
  };
  pts.push({ x: level.start.c * P + T / 2, y: -T * .5 });
  for (const s of sim.steps) {
    const A = edge(s.r, s.c, s.enter), C = center(s.r, s.c), B = edge(s.r, s.c, s.exit);
    // Follow the exact angular pipe centerline: entry → center → exit.
    // No Bézier interpolation, so the marble never cuts across a pipe elbow.
    if (!pts.length || pts[pts.length - 1].x !== A.x || pts[pts.length - 1].y !== A.y) pts.push(A);
    pts.push(C, B);
  }
  const end = sim.end, last = sim.steps[sim.steps.length - 1];
  const gridH = level.rows * T + (level.rows - 1) * G;
  if (end.kind === 'win') {
    pts.push({ x: last.c * P + T / 2, y: gridH + 6 + T * .62 * .45 });
  } else if (end.kind === 'fall') {
    const e = edge(last.r, last.c, last.exit);
    pts.push({ x: e.x + DC[last.exit] * T * .9, y: e.y + DR[last.exit] * T * .9 });
  } else if (end.kind === 'hole') {
    pts.push(edge(end.r, end.c, end.enter), center(end.r, end.c));
  } else {
    pts.push(edge(end.r, end.c, end.enter));
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, cum, total: cum[cum.length - 1] };
}

function place(x, y) { marble.style.translate = (x - M / 2) + 'px ' + (y - M / 2) + 'px'; }

function dropMarble() {
  if (!level || busy || won) return;
  startClock();
  marbles++;
  marblesEl.textContent = marbles;
  busy = true;
  board.classList.add('busy');
  dropBtn.disabled = true;
  status.className = 'status';
  status.textContent = 'Rolling…';
  speedMultiplier = 1; speedBoostUntil = 0; speedBtn.classList.toggle('visible', frenzy); speedBtn.classList.remove('active');

  const sim = simulate(level, false);
  lastRunPath = sim.steps.map(step => [step.r, step.c]);
  const { pts, cum, total } = buildRoute(sim);
  const id = ++runId;
  const dur = Math.max(500, Math.min(7000, total / (T / 200)));

  marble.style.transition = 'none';
  marble.style.opacity = '1';
  marble.style.scale = '1';
  marble.style.display = 'block';
  place(pts[0].x, pts[0].y);

  let previousFrame = performance.now();
  let elapsed = 0;
  let seg = 1;
  function frame(now) {
    if (id !== runId) return;
    elapsed += Math.max(0, now - previousFrame) * speedMultiplier;
    previousFrame = now;
    const t = Math.min(1, elapsed / dur), d = t * total;
    while (seg < cum.length - 1 && cum[seg] < d) seg++;
    const a = pts[seg - 1], b = pts[seg];
    const u = Math.min(1, Math.max(0, (d - cum[seg - 1]) / ((cum[seg] - cum[seg - 1]) || 1)));
    place(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u);
    if (t < 1) requestAnimationFrame(frame); else endEffect(sim.end.kind, id);
  }
  requestAnimationFrame(frame);
}

function endEffect(kind, id) {
  marble.style.transition = 'scale .3s ease, opacity .3s ease';
  marble.style.scale = kind === 'win' ? '.6' : kind === 'hole' ? '0' : kind === 'fall' ? '.8' : '1.8';
  marble.style.opacity = '0';
  setTimeout(() => { if (id === runId) finishRun(kind); }, 330);
}

const MESSAGES = {
  blocked: 'The marble hit a closed end. Rotate some tiles and try again.',
  fall: 'The marble rolled off the edge of the board.',
  hole: 'The marble dropped into a hole.',
  loop: 'The marble went around in circles.',
};

function lightUpPath(path) {
  if (canvasMode) { drawCanvasBoard(); return; }
  // Stagger the glow so long paths cascade instead of popping all at once.
  const perTile = Math.max(10, Math.min(55, Math.floor(1400 / Math.max(1, path.length))));
  path.forEach(([r, c], i) => {
    const t = setTimeout(() => {
      const cell = level.cells[r] && level.cells[r][c];
      if (cell && cell.el) cell.el.classList.add('solved');
    }, i * perTile);
    solvedTimeouts.push(t);
  });
}

function finishRun(kind) {
  marble.style.display = 'none';
  speedBtn.classList.remove('visible','active'); speedMultiplier = 1; speedBoostUntil = 0;
  if (speedBoostTimer) { clearTimeout(speedBoostTimer); speedBoostTimer = null; }
  speedBtn.textContent = 'Speed up »';
  busy = false;
  board.classList.remove('busy');
  if (kind === 'win') {
    won = true;
    // Coin toss: reverse the maze's rotation direction for the next level.
    if (Math.random() < 0.5) spinDir *= -1;
    const elapsedMs = startAt === null ? Infinity : performance.now() - startAt;
    if (elapsedMs <= comboWindowMs()) comboCount++; else comboCount = 0;
    levelRecap.textContent = 'LEVEL ' + boardValue + ' COMPLETE · ' + timeEl.textContent + ' · ' + marbles + (marbles === 1 ? ' MARBLE' : ' MARBLES') + (frenzy ? '' : '');
    frenzy = comboCount >= 3;
    syncComboMusic();
    // Beat the level and the track slams back to lo-fi, then unmuffles
    // over the next COMBO_MUSIC_MUFFLE_MS. Ordered after syncComboMusic so a
    // freshly-started track is muffled too rather than resetting to clean.
    music.muffle = 1;
    levelRecap.textContent = 'LEVEL ' + boardValue + ' COMPLETE · ' + timeEl.textContent + ' · ' + marbles + (marbles === 1 ? ' MARBLE' : ' MARBLES');
    comboBar.classList.toggle('visible', frenzy);
    comboText.textContent = 'x' + comboCount + ' combo';
    comboFill.style.transform = 'scaleX(1)';
    boardValue++;
    document.body.classList.add('won');
    if (canvasMode) drawCanvasBoard();
    stopClock();
    cup.classList.remove('hit'); void cup.offsetWidth; cup.classList.add('hit');
    chute.classList.add('victory');
    cup.classList.add('victory');
    status.className = 'status win';
    status.textContent = 'Solved in ' + timeEl.textContent + ' using ' + marbles + (marbles === 1 ? ' marble!' : ' marbles!');
    newBtn.classList.add('primary');
    if (lastRunPath.length) lightUpPath(lastRunPath);
    if (frenzy) {
      status.textContent += ' · COMBO FRENZY!';
      // Start the next board immediately; newLevel starts its clock immediately too.
      frenzyTimer = setTimeout(() => { if (won && frenzy) newLevel(); }, 0);
    }
  } else {
    if (comboCount > 0 && startAt !== null && performance.now() - startAt >= comboWindowMs()) clearCombo();
    status.className = 'status lose';
    status.textContent = MESSAGES[kind];
    dropBtn.disabled = false;
  }
}

speedBtn.addEventListener('click', () => {
  if (!busy || !frenzy) return;
  // Every tap doubles travel speed for 40 ms; rapid taps add time to the active burst.
  const now = performance.now();
  speedMultiplier = 2;
  speedBoostUntil = Math.max(now, speedBoostUntil) + 40;
  speedBtn.classList.add('active');
  speedBtn.textContent = 'Speeding up';
  if (speedBoostTimer) clearTimeout(speedBoostTimer);
  const settle = () => {
    const remaining = speedBoostUntil - performance.now();
    if (remaining > 0) speedBoostTimer = setTimeout(settle, remaining);
    else {
      speedMultiplier = 1;
      speedBoostUntil = 0;
      speedBtn.classList.remove('active');
      speedBtn.textContent = 'Speed up »';
      speedBoostTimer = null;
    }
  };
  speedBoostTimer = setTimeout(settle, Math.max(1, speedBoostUntil - now));
});
dropBtn.addEventListener('click', dropMarble);
newBtn.addEventListener('click', newLevel);

/* ---------- combo music ----------
   From combo 10 the track loops underneath the game. It arrives deliberately
   lo-fi — silent, low-passed and pitched down to 0.7 — then, for as long as the
   combo survives, it climbs to full volume, an open filter and normal speed
   over COMBO_MUSIC_RAMP. Break the combo and it resets to the top.

   On top of that long ramp sits a short muffle: clearing a level slams
   music.muffle to 1, which drags the ramp's shape to zero for an instant
   before it decays back over COMBO_MUSIC_MUFFLE_MS. Because the ramp and the
   muffle multiply, the effect works the same whether the track is three
   seconds or three minutes into its progression. */
const COMBO_MUSIC_AT        = 10;      // combo level that brings the music in
const COMBO_MUSIC_RAMP      = 120000;  // 2 minutes from lo-fi to full fidelity
const COMBO_MUSIC_MUFFLE_MS = 5000;    // level win: hard muffle, 5s recovery
const COMBO_MUSIC_RATE      = 0.7;     // starting playback rate
const COMBO_MUSIC_CUT       = 320;     // starting low-pass corner (Hz)
const COMBO_MUSIC_OPEN      = 18000;   // fully unmuffled corner (Hz)
const COMBO_MUSIC_VOL       = 0.9;     // normal volume once the ramp finishes
const COMBO_MUSIC_PITCH     = false;   // true = hold pitch while slowing down

const music = { el: null, ctx: null, src: null, lp: null, gain: null, analyser: null, freq: null, ok: false, on: false, t: 0, muffle: 0, stopTimer: null };

function initMusic() {
  if (music.el) return;
  const el = new Audio('combo.mp3');
  el.loop = true;
  el.preload = 'auto';
  music.el = el;
  try {
    el.preservesPitch = COMBO_MUSIC_PITCH;
    el.mozPreservesPitch = COMBO_MUSIC_PITCH;
    el.webkitPreservesPitch = COMBO_MUSIC_PITCH;
  } catch (_) {}
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    const ctx = new Ctx();
    const src = ctx.createMediaElementSource(el);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = COMBO_MUSIC_CUT;
    lp.Q.value = 0.6;
    const gain = ctx.createGain();
    gain.gain.value = 0;
    src.connect(lp).connect(gain).connect(ctx.destination);
    // Tapped after the filter, so the visualiser tracks what is actually heard.
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.72;
    lp.connect(analyser);
    const freq = new Uint8Array(analyser.frequencyBinCount);
    Object.assign(music, { ctx, src, lp, gain, analyser, freq, ok: true });
  } catch (_) { music.ok = false; }
}

function startMusic() {
  initMusic();
  if (!music.ok || music.on) return;
  if (music.ctx.state === 'suspended') music.ctx.resume().catch(() => {});
  clearTimeout(music.stopTimer);
  const now = music.ctx.currentTime;
  music.on = true;
  music.t = 0;
  music.muffle = 0;                                  // fresh start is never muffled
  music.gain.gain.cancelScheduledValues(now);
  music.gain.gain.setValueAtTime(0, now);            // start silent
  music.lp.frequency.cancelScheduledValues(now);
  music.lp.frequency.setValueAtTime(COMBO_MUSIC_CUT, now); // start muffled
  music.el.playbackRate = COMBO_MUSIC_RATE;          // start slowed
  try { music.el.currentTime = 0; } catch (_) {}
  const p = music.el.play();
  if (p && p.catch) p.catch(() => {});
}

function stopMusic() {
  if (!music.ok || !music.on) return;
  music.on = false;
  music.t = 0;
  music.muffle = 0;
  const now = music.ctx.currentTime;
  music.gain.gain.cancelScheduledValues(now);
  music.gain.gain.setValueAtTime(music.gain.gain.value, now);
  music.gain.gain.setTargetAtTime(0, now, 0.05);     // short anti-click fade
  music.lp.frequency.setValueAtTime(COMBO_MUSIC_CUT, now);
  music.el.playbackRate = COMBO_MUSIC_RATE;
  clearTimeout(music.stopTimer);
  music.stopTimer = setTimeout(() => { if (!music.on) music.el.pause(); }, 260);
}

function syncComboMusic() {
  if (comboCount >= COMBO_MUSIC_AT) startMusic(); else stopMusic();
}

function tickMusic(dt) {
  if (!music.ok || !music.on) return;
  music.t = Math.min(1, music.t + dt / COMBO_MUSIC_RAMP);
  // Linear decay from the level-win slam back to clean over 5 seconds.
  music.muffle = Math.max(0, music.muffle - dt / COMBO_MUSIC_MUFFLE_MS);
  const now = music.ctx.currentTime;
  // Ramp and muffle multiply, so a win sounds the same at combo 10 or combo 40.
  const shape = music.t * (1 - music.muffle);
  music.gain.gain.setTargetAtTime(COMBO_MUSIC_VOL * shape, now, 0.08);
  music.lp.frequency.setTargetAtTime(
    COMBO_MUSIC_CUT * Math.pow(COMBO_MUSIC_OPEN / COMBO_MUSIC_CUT, shape), now, 0.15);
  music.el.playbackRate = COMBO_MUSIC_RATE + (1 - COMBO_MUSIC_RATE) * shape;
}

/* ---------- grid spin (per-frame) ----------
   Eases the rotation speed up while the combo is at or above COMBO_MUSIC_AT,
   and back down when it drops. Once the spin has bled off, the board glides
   upright along the shortest arc so it never rests at an odd angle.
   spinDir carries the per-level coin toss, so the maze reverses direction
   every time a board is cleared. */
function tickSpin(dt) {
  const wantSpin = comboCount >= COMBO_MUSIC_AT;
  const targetSpeed = wantSpin ? SPIN_DEG_PER_SEC * spinDir : 0;
  spinSpeed += (targetSpeed - spinSpeed) * Math.min(1, dt / 250);
  spinAngle += spinSpeed * dt / 1000;

  if (!wantSpin && Math.abs(spinSpeed) < 0.1) {
    // Wrap to [-180, 180] so we always unwind the short way.
    let a = ((spinAngle + 180) % 360 + 360) % 360 - 180;
    a *= Math.pow(0.9, dt / 16.7);
    if (Math.abs(a) < 0.08) { a = 0; spinSpeed = 0; }
    spinAngle = a;
  }

  const rounded = Math.round(spinAngle * 100) / 100;
  if (rounded !== spinLastSet) {
    board.style.setProperty('--spin', rounded + 'deg');
    spinLastSet = rounded;
  }
}

/* ---------- shooting stars (combo 15+) ----------
   The streaks live in *board* coordinates. Every frame the canvas re-applies
   the board's own transform — translate to viewport centre + pan, rotate by
   spinAngle, scale by zoom, then shift by -board/2 — so they inherit the
   maze's rotation for free. Colours are rebuilt from the same HSL numbers
   previewDifficulty pushes into --accent, so the stars always match the pipes.
   The layer sits at z-index 0 (behind the board) to keep the pipes readable. */
const COMBO_STARS_AT = 15;
const starfield = document.getElementById('starfield');
const starCtx = starfield.getContext('2d', { alpha: true, desynchronized: true });
const stars = [];
let starSpawnAccum = 0, starDpr = 1, starsDirty = false;

function sizeStarfield() {
  starDpr = Math.min(1.5, window.devicePixelRatio || 1);
  starfield.width  = Math.round(innerWidth  * starDpr);
  starfield.height = Math.round(innerHeight * starDpr);
  starfield.style.width  = innerWidth  + 'px';
  starfield.style.height = innerHeight + 'px';
}
sizeStarfield();
window.addEventListener('resize', sizeStarfield);

function spawnStar() {
  const bw = level.cols * T, bh = level.rows * T;
  // Start above the board so the streak enters the frame from off-screen.
  const x = -bw * 0.40 + Math.random() * bw * 1.80;
  const y = -bh * 0.45 - Math.random() * bh * 0.55;
  const dir = Math.PI / 2 + (Math.random() - 0.5) * 0.7;   // mostly straight down
  stars.push({
    x, y, dir,
    speed: 260 + Math.random() * 420,                      // board px / second
    len:   T * (1.0 + Math.random() * 2.4),                // tail length, board px
    w:     T * (0.030 + Math.random() * 0.05),             // stroke width, board px
    t: 0,
    life: 1.5 + Math.random() * 1.4,
  });
}

function tickStars(dt) {
  const active = comboCount >= COMBO_STARS_AT && !!level;

  // Nothing to spawn, nothing alive, nothing left on screen → skip entirely.
  if (!active && !stars.length) {
    if (starsDirty) {
      starCtx.setTransform(starDpr, 0, 0, starDpr, 0, 0);
      starCtx.clearRect(0, 0, innerWidth, innerHeight);
      starsDirty = false;
    }
    return;
  }

  starCtx.setTransform(starDpr, 0, 0, starDpr, 0, 0);
  starCtx.clearRect(0, 0, innerWidth, innerHeight);
  starsDirty = true;

  if (active) {
    // Spawn rate climbs with the combo so late runs feel denser.
    const rate = Math.min(7, 1.6 + (comboCount - COMBO_STARS_AT) * 0.35);
    starSpawnAccum += (dt / 1000) * rate;
    let guard = 0;
    while (starSpawnAccum >= 1 && guard++ < 8) { starSpawnAccum -= 1; spawnStar(); }
  } else {
    starSpawnAccum = 0;
  }

  if (!stars.length || !level) return;

  const dts = dt / 1000;
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.t += dts;
    if (s.t >= s.life) { stars.splice(i, 1); continue; }
    s.x += Math.cos(s.dir) * s.speed * dts;
    s.y += Math.sin(s.dir) * s.speed * dts;
  }
  if (!stars.length) return;

  // Mirror of the board's CSS transform, so stars share the maze's world.
  const bw = level.cols * T, bh = level.rows * T;
  starCtx.translate(innerWidth / 2 + cameraX, innerHeight / 2 + cameraY);
  starCtx.rotate(spinAngle * Math.PI / 180);
  starCtx.scale(zoom, zoom);
  starCtx.translate(-bw / 2, -bh / 2);

  const [r, g, b] = hslToRgb(accentH, accentS, accentL);
  starCtx.lineCap = 'butt';   // flat rectangular ends, as requested

  for (const s of stars) {
    const p = s.t / s.life;
    const alpha = Math.min(1, p * 5) * Math.min(1, (1 - p) * 2.6);
    if (alpha <= 0.004) continue;

    const dx = Math.cos(s.dir), dy = Math.sin(s.dir);
    const hx = s.x,             hy = s.y;                    // head
    const tx = s.x - dx * s.len, ty = s.y - dy * s.len;      // tail

    const grad = starCtx.createLinearGradient(hx, hy, tx, ty);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

    starCtx.strokeStyle = grad;
    // Constant-ish screen thickness once the camera pulls back a long way.
    starCtx.lineWidth = s.w / Math.max(0.5, zoom);
    starCtx.beginPath();
    starCtx.moveTo(hx, hy);
    starCtx.lineTo(tx, ty);
    starCtx.stroke();
  }
}

/* ---------- beat visualiser + vignette ----------
   Two spectrum strips fed by the analyser above — one hugging the bottom edge,
   one mirrored at the top so its bars hang downwards. Each kick drum fires a
   pulse that decays; the strips fade in at the combo-10 threshold and keep
   brightening for VIZ_RAMP, but never past a low ceiling so the pipes stay
   readable. The vignette uses the same pulse to glow around the screen edges. */
const VIZ_RAMP      = 240000;  // 4 minutes from dim to its brightest
const VIZ_ALPHA_MIN = 0.18;    // baseline visibility once music is running (was 0.07 — too faint)
const VIZ_ALPHA_MAX = 0.42;    // final ceiling — still deliberately restrained
const VIZ_HEIGHT    = 118;     // logical height of the strip in CSS pixels

const vizCanvas    = document.getElementById('viz');
const vizCtx       = vizCanvas.getContext('2d', { alpha: true, desynchronized: true });
const vizTopCanvas = document.getElementById('vizTop');
const vizTopCtx    = vizTopCanvas.getContext('2d', { alpha: true, desynchronized: true });
const vignetteEl   = document.getElementById('vignette');

let vizW = 0, vizH = VIZ_HEIGHT;
let vizT = 0, vizAlpha = 0, vizTarget = 0;
let bassAvg = 0.015, bassSmooth = 0, pulse = 0, lastBeatAt = 0;
let vigSmooth = 0;

function sizeViz() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  vizW = window.innerWidth;
  vizH = VIZ_HEIGHT;
  for (const cv of [vizCanvas, vizTopCanvas]) {
    cv.width  = Math.round(vizW * dpr);
    cv.height = Math.round(vizH * dpr);
    cv.style.width  = vizW + 'px';
    cv.style.height = vizH + 'px';
  }
  vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vizTopCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeViz();
window.addEventListener('resize', sizeViz);

function vizTick(dt, now) {
  const running = music.ok && music.on && music.el && !music.el.paused;

  if (running) {
    vizT = Math.min(1, vizT + dt / VIZ_RAMP);
    vizTarget = VIZ_ALPHA_MIN + (VIZ_ALPHA_MAX - VIZ_ALPHA_MIN) * vizT;
  } else {
    vizT = 0;
    vizTarget = 0;
  }
  vizAlpha += (vizTarget - vizAlpha) * Math.min(1, dt / 200);

  // Always clear both strips so the mirrored copy mirrors everything exactly.
  vizCtx.clearRect(0, 0, vizW, vizH);
  vizTopCtx.clearRect(0, 0, vizW, vizH);

  // Sample the spectrum and look for a kick in the bass band.
  let data = null;
  if (running && music.analyser) {
    data = music.freq;
    music.analyser.getByteFrequencyData(data);
    let bass = 0;
    for (let i = 1; i <= 5; i++) bass += data[i];
    bass = Math.pow(bass / (5 * 255), 1.35);
    bassSmooth += (bass - bassSmooth) * 0.28;
    bassAvg += (bass - bassAvg) * 0.012;
    if (bass > bassAvg * 1.32 && bass > 0.12 && now - lastBeatAt > 170) {
      lastBeatAt = now;
      pulse = Math.min(1.5, pulse + 0.85);
    }
  }
  pulse *= Math.pow(0.9, dt / 16.7);

  // Vignette: normalized ramp brightness × the live beat pulse.
  // Baseline lifted from 0.06 → 0.28 so there is a visible resting glow
  // between kicks instead of a near-zero haze.
  const vNorm = VIZ_ALPHA_MAX > 0 ? Math.min(1, vizAlpha / VIZ_ALPHA_MAX) : 0;
  const beat = Math.min(1, pulse / 1.2);
  const vigTarget = running ? vNorm * (0.28 + beat * 0.72) : 0;
  vigSmooth += (vigTarget - vigSmooth) * Math.min(1, dt / 55);
  vignetteEl.style.opacity = vigSmooth < 0.003 ? '0' : vigSmooth.toFixed(3);

  if (!data || vizAlpha < 0.004) return;

  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#a5d84b';
  const bars = Math.max(22, Math.min(64, Math.round(vizW / 15)));
  const slot = vizW / bars;
  const maxBin = Math.min(data.length - 1, 240);
  const ceiling = vizH * 0.9;

  // Paint the identical strip into both canvases. The top one is flipped by
  // CSS (scaleY -1, origin centre), so what lands at the bottom of its box
  // appears at the very top of the screen, bars pointing down.
  for (const ctx of [vizCtx, vizTopCtx]) {
    ctx.fillStyle = accent;
    for (let i = 0; i < bars; i++) {
      const bin = Math.max(1, Math.round(Math.pow(maxBin, i / (bars - 1))));
      const v = Math.pow((data[bin] || 0) / 255, 1.3);
      const h = Math.min(ceiling, (v * 0.8 + pulse * 0.45) * ceiling);
      if (h < 1.2) continue;
      ctx.globalAlpha = vizAlpha * (0.3 + 0.7 * (h / ceiling));
      ctx.fillRect(i * slot, vizH - h, Math.max(1, slot - 2), h);
    }
    // Slim beat bar welded to the very edge of the strip.
    ctx.globalAlpha = vizAlpha * (0.55 + 0.45 * Math.min(1, pulse));
    ctx.fillRect(0, vizH - 2.5, vizW, 2.5);
    ctx.globalAlpha = 1;
  }
}

/* ---------- combo flash ---------- */
const flashEl = document.getElementById('flash');
function flashScreen() {
  flashEl.classList.remove('fire');
  void flashEl.offsetWidth;      // restart the animation
  flashEl.classList.add('fire');
}

let musicLast = performance.now();
function musicFrame(now) {
  const dt = Math.min(250, now - musicLast);
  musicLast = now;
  tickMusic(dt);
  vizTick(dt, now);
  tickStars(dt);
  tickSpin(dt);
  requestAnimationFrame(musicFrame);
}
requestAnimationFrame(musicFrame);

/* Browsers only let audio start from a gesture; warm the context up on the
   first tap so it is already running by the time combo 10 arrives. */
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, () => {
    initMusic();
    if (music.ctx && music.ctx.state === 'suspended') music.ctx.resume().catch(() => {});
  }, { passive: true })
);

newLevel();
</script>
</body>
