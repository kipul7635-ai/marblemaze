/* ---------- infinite progression ----------
   Every level rolls a brand-new accent colour rather than walking the hue
   wheel, so consecutive boards read as a fresh palette instead of a slow
   drift. Saturation and lightness still tighten with the level value, and a
   minimum hue separation stops the new colour from landing next to the old
   one. The random walk is skipped for the very first board only in the sense
   that there is no previous colour to avoid. */
const HUE_MIN_SEPARATION = 60;   // degrees of hue distance between boards
let huePos = 142;                // current accent hue (also seeds the first roll)
let accentH = 142, accentS = 64, accentL = 56;
/* Mirrors of the live accent so the starfield can build rgba() strings
   without re-parsing a computed CSS colour every frame. */

function hueDistance(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

function previewDifficulty(value) {
  // Roll a new hue, re-rolling if it lands too close to the outgoing one.
  let hue = Math.random() * 360;
  for (let guard = 0; guard < 20 && hueDistance(hue, huePos) < HUE_MIN_SEPARATION; guard++) {
    hue = Math.random() * 360;
  }
  huePos = hue;
  const sat = Math.min(88, 64 + Math.floor(Math.max(0, value - 4) / 8));
  const light = Math.max(43, 56 - Math.floor(Math.max(0, value - 4) / 12));
  accentH = hue; accentS = sat; accentL = light;
  document.documentElement.style.setProperty('--accent', `hsl(${hue} ${sat}% ${light}%)`);
  document.documentElement.style.setProperty('--correct-hi', `hsl(${(hue + 42) % 360} 85% 72%)`);
  document.documentElement.style.setProperty('--correct-lo', `hsl(${(hue + 42) % 360} 72% 38%)`);
  // The board glow is a radial gradient built from the same RGB triplet, so
  // it has to be re-baked whenever the accent changes.
  updateGlowGradient();
}

/* ---------- difficulty multiplier ----------
   Difficulty sets how fast the run escalates:
     · Normal mode  → boardValue advances by `difficulty` per cleared level.
     · Scroller mode → each width expansion adds `difficulty` tiles.
   Minimum 1, no maximum. Board *generation* is capped at BOARD_VALUE_CAP so
   an absurd difficulty can't hang the page mid-generate; the badge flags
   when the cap kicks in.

   The panel is only shown on the menu board (boardValue === 4) and while a
   Scroller run hasn't begun. Completing level 1 (which pushes boardValue
   past 4) or dropping the first Scroller marble hides it — the choice has
   been committed at that point. */
let difficulty = 1;
const BOARD_VALUE_CAP = 100;
const generationValue = v => Math.min(v, BOARD_VALUE_CAP);

function updateDiffHint() {
  if (scrollerMode) {
    diffHintEl.textContent = '+' + difficulty + ' tile' + (difficulty === 1 ? '' : 's') + ' per expansion';
  } else {
    diffHintEl.textContent = '+' + difficulty + ' value per level';
  }
}
function setDifficulty(next) {
  difficulty = Math.max(1, next);
  diffValueEl.textContent = difficulty;
  diffDownBtn.disabled = difficulty <= 1;
  updateDiffHint();
}
diffDownBtn.addEventListener('click', () => setDifficulty(difficulty - 1));
diffUpBtn.addEventListener('click', () => setDifficulty(difficulty + 1));
updateDiffHint();

function newLevel() {
  if (scrollerMode) { buildScrollerMenu(); return; }
  updateDiffHint();
  document.body.classList.remove('won');
  runId++;
  busy = false; won = false; marbles = 0; lastRunPath = [];
  solvedTimeouts.forEach(clearTimeout);
  solvedTimeouts = [];
  marble.style.display = 'none';
  speedBtn.classList.remove('visible','active'); speedMultiplier = 1; speedBoostUntil = 0;
  if (speedBoostTimer) { clearTimeout(speedBoostTimer); speedBoostTimer = null; }
  speedBtn.textContent = 'Speed up »';
  if (frenzyTimer) { clearTimeout(frenzyTimer); frenzyTimer = null; }
  chute.classList.remove('victory'); cup.classList.remove('victory');
  board.classList.remove('busy');
  resetClock();
  marblesEl.textContent = '0';
  const cfg = configForValue(generationValue(boardValue));
  previewDifficulty(boardValue);
  try {
    level = generateLevel(cfg);
  } catch (err) {
    console.error('Level generation failed, falling back:', err);
    level = generateLevel(configForValue(60));
    status.textContent = 'Board generation fell back to a smaller size.';
  }
  buildBoard();
  // Canvas pipes use a snapshot of the accent color, so repaint immediately on every level.
  drawCanvasBoard();
  cameraX = 0; cameraY = 0;
  zoom = Math.min(1, Math.max(.15, Math.min((innerWidth * .82) / (level.cols * T), (innerHeight * .72) / (level.rows * T))));
  updateCamera();
  badge.textContent = 'DIFF ' + difficulty
    + '  ·  VALUE ' + boardValue
    + '  ·  ' + level.cols + ' × ' + level.rows
    + '  ·  ' + level.holeCells + ' HOLES'
    + '  ·  ' + level.lockedCells + ' LOCKED'
    + (boardValue > BOARD_VALUE_CAP ? '  ·  SIZE CAPPED' : '');
  dropBtn.disabled = false;
  newBtn.classList.remove('primary');
  status.className = 'status';
  status.textContent = 'Rotate the tiles to build a route, then drop a marble.';
  // Chill / scroller / difficulty are menu-board-only options: once value
  // climbs past 4 they all disappear until the page is reloaded.
  chillToggle.classList.toggle('hidden', boardValue !== 4);
  scrollerToggle.classList.toggle('hidden', boardValue !== 4);
  diffPanel.classList.toggle('hidden', boardValue !== 4);
  // A new board wipes any stars still in flight.
  stars.length = 0; starSpawnAccum = 0;
  ambientStars.length = 0; ambientSpawnAccum = 0;
  if (frenzy) { document.body.classList.add('frenzy-mode'); startClock(); }
  else document.body.classList.remove('frenzy-mode');
  // Every fresh board pops with a white flash once the combo has the music running.
  if (comboCount >= COMBO_MUSIC_AT) flashScreen();
}

chillToggle.addEventListener('click', () => {
  if (boardValue !== 4) return;      // only selectable on the initial board
  chillMode = !chillMode;
  chillToggle.setAttribute('aria-pressed', chillMode ? 'true' : 'false');
  status.className = 'status';
  status.textContent = chillMode
    ? (scrollerMode ? 'Chill mode on — combos never expire and the marble speeds up more slowly.' : 'Chill mode on — combos never expire.')
    : 'Chill mode off — combos expire on the timer.';
});

panel.addEventListener('click', e => {
  if (scrollerMode) { scrollerClick(e); return; }
  if (!canvasMode || !level || busy || won || dragged || suppressTileClick) return;
  const w = board.offsetWidth, h = board.offsetHeight;
  // Undo translate, scale and grid rotation to get board-local pixels.
  const px = (e.clientX - (innerWidth / 2 + cameraX)) / zoom;
  const py = (e.clientY - (innerHeight / 2 + cameraY)) / zoom;
  const th = spinAngle * Math.PI / 180;
  const cos = Math.cos(th), sin = Math.sin(th);
  const lx = w / 2 + px * cos + py * sin;
  const ly = h / 2 - px * sin + py * cos;
  const c = Math.floor(lx / T), r = Math.floor(ly / T);
  if (r < 0 || r >= level.rows || c < 0 || c >= level.cols) return;
  const cell = level.cells[r][c]; if (cell.hole) return;
  if (cell.locked || cell.type === 'cross') { status.textContent = 'That tile cannot be rotated.'; return; }
  startClock(); cell.rot = (cell.rot + 1) % 4; cell.deg = cell.rot * 90; drawCanvasBoard();
});

gridEl.addEventListener('click', (e) => {
  if (canvasMode) return;
  const btn = e.target.closest('button.cell');
  if (!btn || !level || busy || won || suppressTileClick) return;
  const cell = level.cells[+btn.dataset.r][+btn.dataset.c];
  if (cell.locked || cell.type === 'cross') {
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    return;
  }
  startClock();
  cell.rot = (cell.rot + 1) % 4;
  cell.deg += 90;
  btn.firstChild.style.transform = 'rotate(' + cell.deg + 'deg)';
});

function buildRoute(sim) {
  const P = T, pts = [];
  const center = (r, c) => ({ x: c * P + T / 2, y: r * P + T / 2 });
  const edge = (r, c, s) => {
    const o = center(r, c), h = T / 2;
    return { x: o.x + DC[s] * h, y: o.y + DR[s] * h };
  };
  pts.push({ x: level.start.c * P + T / 2, y: -T * .5 });
  for (const s of sim.steps) {
    const A = edge(s.r, s.c, s.enter), C = center(s.r, s.c), B = edge(s.r, s.c, s.exit);
    // Follow the exact angular pipe centerline: entry → center → exit.
    // No Bézier interpolation, so the marble never cuts across a pipe elbow.
    if (!pts.length || pts[pts.length - 1].x !== A.x || pts[pts.length - 1].y !== A.y) pts.push(A);
    pts.push(C, B);
  }
  const end = sim.end, last = sim.steps[sim.steps.length - 1];
  const gridH = level.rows * T + (level.rows - 1) * G;
  if (end.kind === 'win') {
    pts.push({ x: last.c * P + T / 2, y: gridH + 6 + T * .62 * .45 });
  } else if (end.kind === 'fall') {
    const e = edge(last.r, last.c, last.exit);
    pts.push({ x: e.x + DC[last.exit] * T * .9, y: e.y + DR[last.exit] * T * .9 });
  } else if (end.kind === 'hole') {
    pts.push(edge(end.r, end.c, end.enter), center(end.r, end.c));
  } else {
    pts.push(edge(end.r, end.c, end.enter));
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, cum, total: cum[cum.length - 1] };
}

function place(x, y) { marble.style.translate = (x - M / 2) + 'px ' + (y - M / 2) + 'px'; }

function dropMarble() {
  if (scrollerMode) { scrollerDrop(); return; }
  if (!level || busy || won) return;
  startClock();
  marbles++;
  marblesEl.textContent = marbles;
  busy = true;
  board.classList.add('busy');
  dropBtn.disabled = true;
  status.className = 'status';
  status.textContent = 'Rolling…';
  speedMultiplier = 1; speedBoostUntil = 0; speedBtn.classList.toggle('visible', frenzy); speedBtn.classList.remove('active');

  const sim = simulate(level, false);
  lastRunPath = sim.steps.map(step => [step.r, step.c]);
  const { pts, cum, total } = buildRoute(sim);
  const id = ++runId;
  const dur = Math.max(500, Math.min(7000, total / (T / 200)));

  marble.style.transition = 'none';
  marble.style.opacity = '1';
  marble.style.scale = '1';
  marble.style.display = 'block';
  place(pts[0].x, pts[0].y);

  let previousFrame = performance.now();
  let elapsed = 0;
  let seg = 1;
  function frame(now) {
    if (id !== runId) return;
    elapsed += Math.max(0, now - previousFrame) * speedMultiplier;
    previousFrame = now;
    const t = Math.min(1, elapsed / dur), d = t * total;
    while (seg < cum.length - 1 && cum[seg] < d) seg++;
    const a = pts[seg - 1], b = pts[seg];
    const u = Math.min(1, Math.max(0, (d - cum[seg - 1]) / ((cum[seg] - cum[seg - 1]) || 1)));
    place(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u);
    if (t < 1) requestAnimationFrame(frame); else endEffect(sim.end.kind, id);
  }
  requestAnimationFrame(frame);
}

function endEffect(kind, id) {
  marble.style.transition = 'scale .3s ease, opacity .3s ease';
  marble.style.scale = kind === 'win' ? '.6' : kind === 'hole' ? '0' : kind === 'fall' ? '.8' : '1.8';
  marble.style.opacity = '0';
  setTimeout(() => { if (id === runId) finishRun(kind); }, 330);
}

const MESSAGES = {
  blocked: 'The marble hit a closed end. Rotate some tiles and try again.',
  fall: 'The marble rolled off the edge of the board.',
  hole: 'The marble dropped into a hole.',
  loop: 'The marble went around in circles.',
};

function lightUpPath(path) {
  if (canvasMode) { drawCanvasBoard(); return; }
  // Stagger the glow so long paths cascade instead of popping all at once.
  const perTile = Math.max(10, Math.min(55, Math.floor(1400 / Math.max(1, path.length))));
  path.forEach(([r, c], i) => {
    const t = setTimeout(() => {
      const cell = level.cells[r] && level.cells[r][c];
      if (cell && cell.el) cell.el.classList.add('solved');
    }, i * perTile);
    solvedTimeouts.push(t);
  });
}

function finishRun(kind) {
  marble.style.display = 'none';
  speedBtn.classList.remove('visible','active'); speedMultiplier = 1; speedBoostUntil = 0;
  if (speedBoostTimer) { clearTimeout(speedBoostTimer); speedBoostTimer = null; }
  speedBtn.textContent = 'Speed up »';
  busy = false;
  board.classList.remove('busy');
  if (kind === 'win') {
    won = true;
    // Coin toss: reverse the maze's rotation direction for the next level.
    if (Math.random() < 0.5) spinDir *= -1;
    const elapsedMs = startAt === null ? Infinity : performance.now() - startAt;
    if (elapsedMs <= comboWindowMs()) comboCount++; else comboCount = 0;
    levelRecap.textContent = 'LEVEL ' + boardValue + ' COMPLETE · ' + timeEl.textContent + ' · ' + marbles + (marbles === 1 ? ' MARBLE' : ' MARBLES') + (frenzy ? '' : '');
    frenzy = comboCount >= 3;
    syncComboMusic();
    // Beat the level and the track slams back to lo-fi, then unmuffles
    // over the next COMBO_MUSIC_MUFFLE_MS. Ordered after syncComboMusic so a
    // freshly-started track is muffled too rather than resetting to clean.
    // Depth is deliberately partial (see the MUFFLE_DEPTH / MUFFLE_VOLUME
    // constants) so the track only dulls — it never cuts out.
    music.muffle = 1;
    levelRecap.textContent = 'LEVEL ' + boardValue + ' COMPLETE · ' + timeEl.textContent + ' · ' + marbles + (marbles === 1 ? ' MARBLE' : ' MARBLES');
    comboBar.classList.toggle('visible', frenzy);
    comboText.textContent = 'x' + comboCount + ' combo';
    comboFill.style.transform = 'scaleX(1)';
    boardValue += difficulty;
    // The menu-board window has closed: hide the difficulty selector along
    // with the other first-board-only options.
    diffPanel.classList.add('hidden');
    document.body.classList.add('won');
    if (canvasMode) drawCanvasBoard();
    stopClock();
    cup.classList.remove('hit'); void cup.offsetWidth; cup.classList.add('hit');
    chute.classList.add('victory');
    cup.classList.add('victory');
    status.className = 'status win';
    status.textContent = 'Solved in ' + timeEl.textContent + ' using ' + marbles + (marbles === 1 ? ' marble!' : ' marbles!');
    newBtn.classList.add('primary');
    if (lastRunPath.length) lightUpPath(lastRunPath);
    if (frenzy) {
      status.textContent += ' · COMBO FRENZY!';
      // Start the next board immediately; newLevel starts its clock immediately too.
      frenzyTimer = setTimeout(() => { if (won && frenzy) newLevel(); }, 0);
    }
  } else {
    if (comboCount > 0 && startAt !== null && performance.now() - startAt >= comboWindowMs()) clearCombo();
    status.className = 'status lose';
    status.textContent = MESSAGES[kind];
    dropBtn.disabled = false;
  }
}

speedBtn.addEventListener('click', () => {
  if (!busy || !frenzy) return;
  // Every tap doubles travel speed for 40 ms; rapid taps add time to the active burst.
  const now = performance.now();
  speedMultiplier = 2;
  speedBoostUntil = Math.max(now, speedBoostUntil) + 40;
  speedBtn.classList.add('active');
  speedBtn.textContent = 'Speeding up';
  if (speedBoostTimer) clearTimeout(speedBoostTimer);
  const settle = () => {
    const remaining = speedBoostUntil - performance.now();
    if (remaining > 0) speedBoostTimer = setTimeout(settle, remaining);
    else {
      speedMultiplier = 1;
      speedBoostUntil = 0;
      speedBtn.classList.remove('active');
      speedBtn.textContent = 'Speed up »';
      speedBoostTimer = null;
    }
  };
  speedBoostTimer = setTimeout(settle, Math.max(1, speedBoostUntil - now));
});
dropBtn.addEventListener('click', dropMarble);
newBtn.addEventListener('click', newLevel);

/* ---------- scroller mode ----------
   An endless falling path instead of one board after another. The value-4
   board is the menu: with "Scroller mode" ticked it becomes a straight line of
   straight pipes, and the first drop starts the run. From then on the marble
   never stops rolling; rows are generated ahead of it and the player rotates
   tiles to keep the route connected. One mistake (dead end, hole, side wall,
   loop, or backing out of the world) ends the run and the game returns to the
   menu.

   The camera is free. Nothing follows the marble: drag (or use the arrow keys
   / WASD) to move around, wheel, pinch or the +/- buttons to zoom, and the
   home button to snap back to the marble. The world is drawn on its own
   full-screen canvas (#scCanvas) and respects the combo spin.

   Every row is built around a guaranteed "spine": the route enters from the
   top, may run sideways a few tiles, and leaves through the bottom into the top
   of the next row. The spine tiles are then scrambled, so a row is always
   solvable but never starts solved.

   Glowing stars sit on random tiles (mostly on the route, some as bait just off
   it). The marble collects one by rolling through the middle of its tile: each
   adds one to the combo and a little permanent speed. The combo drains over
   SC_COMBO_MS between stars; Chill mode makes it never drain and slows every
   source of acceleration. The existing combo effects (music, spin, ambient
   stars, glow) all run off comboCount, exactly as in the normal game.

   Difficulty creeps up very slowly: speed grows a little per tile travelled and
   per star, and later rows drift further sideways, arrive more scrambled and
   gain decoy holes and locks. Positions are in tile units (1 = one tile). */
const SC_VIEW_ROWS = 11;      // rows the default zoom fits on screen
const SC_AHEAD = 16;          // rows generated beyond the deepest row the marble has reached
const SC_KEEP_BEHIND = 6;     // rows kept behind it; the marble backing out past these ends the run
const SC_RUNWAY = 10;         // straight rows before the first generated row
const SC_BASE_SPEED = 2.0 / 2.5;   // original 2.0 tiles/s divided by 2.5
const SC_SPEED_GAIN = 0.00035;  // very gentle speed increase per tile travelled
const SC_STAR_SPEED = 0.015;  // small speed increase per star collected
const SC_CHILL_ACCEL = 0.05;  // Chill mode uses only 5% of normal acceleration
const SC_MAX_SPEED = 6.5;
const SC_DEPTH_SPAN = 200;    // rows until row generation reaches full difficulty
const SC_STAR_CHANCE = 0.32;  // stars are occasional, not a dominant visual
const SC_STAR_ON_ROUTE = 0.7; // share of stars placed on the route (the rest are bait)
const SC_COMBO_MS = 24000;    // longer combo window after each star (Chill: forever)
const SC_PAN_PX = 560;        // keyboard pan speed, screen px per second
const SC_BEST_KEY = 'marbleScrollerBest';
const SC_MESSAGES = {
  blocked: 'The marble hit a closed end.',
  fall: 'The marble rolled off the side.',
  hole: 'The marble dropped into a hole.',
  loop: 'The marble went around in circles.',
  void: 'The marble climbed back into the void.',
};

const scCanvas = Object.assign(document.createElement('canvas'), { id: 'scCanvas' });
const scCtx = scCanvas.getContext('2d', { alpha: true });
panel.appendChild(scCanvas);

function scBest() { try { return +localStorage.getItem(SC_BEST_KEY) || 0; } catch (_) { return 0; } }
function scSaveBest(v) { try { localStorage.setItem(SC_BEST_KEY, String(v)); } catch (_) {} }
function scSpeed() {
  const accel = SC_SPEED_GAIN * sc.tiles + sc.starSpeed;
  return Math.min(SC_MAX_SPEED, SC_BASE_SPEED + accel * (chillMode ? SC_CHILL_ACCEL : 1));
}

/* ---- row generation ---- */
function scNewCell() {
  const roll = Math.random();
  return { hole: false, locked: false, onPath: false, inUse: false, deg: 0, star: false, starPhase: 0,
    type: roll < .45 ? 'curve' : roll < .8 ? 'straight' : 'cross', rot: rnd(4), solRot: 0 };
}

// Tile and pose that carry a marble in through side `enter` and out through side `exit`.
function scRouteTile(enter, exit, crossChance) {
  if ((enter + 2) % 4 === exit) {
    const cross = Math.random() < crossChance;
    return { type: cross ? 'cross' : 'straight', solRot: cross ? 0 : (enter % 2 === 0 ? 0 : 1) };
  }
  return { type: 'curve', solRot: (enter + 1) % 4 === exit ? enter : exit };
}

function scGenRow() {
  const r = sc.genRow++, W = sc.cols, mid = Math.floor(W / 2);
  const row = Array.from({ length: W }, scNewCell);
  sc.rows.set(r, row);

  if (r < SC_RUNWAY) {                       // the opening straight line: nothing else is drawn
    row.forEach((cell, c) => { if (c !== mid) cell.hole = true; });
    const t = row[mid];
    t.type = 'straight'; t.rot = t.solRot = 0; t.onPath = true;
    if (r === 3 || r === 6 || r === 8) { t.star = true; t.starPhase = Math.random() * 6.3; }   // a first taste of stars
    sc.spineCol = mid;
    return;
  }

  const diff = Math.min(1, (r - SC_RUNWAY) / SC_DEPTH_SPAN);
  const c0 = sc.spineCol, maxDrift = Math.min(W - 1, 1 + Math.round(diff * 2));
  let c1 = c0;
  if (Math.random() > 0.4 - 0.3 * diff) {    // otherwise the spine drops straight down this row
    const options = [];
    for (let c = Math.max(0, c0 - maxDrift); c <= Math.min(W - 1, c0 + maxDrift); c++) if (c !== c0) options.push(c);
    c1 = options[rnd(options.length)];
  }
  const dir = Math.sign(c1 - c0), sideOut = dir > 0 ? 1 : 3;
  const spine = [];
  const lay = (c, enter, exit) => {
    const cell = row[c], rt = scRouteTile(enter, exit, .15);
    cell.type = rt.type; cell.solRot = cell.rot = rt.solRot;
    cell.onPath = true; cell.hole = false; cell.locked = false;
    spine.push(cell);
  };
  if (dir === 0) lay(c0, 0, 2);
  else {
    lay(c0, 0, sideOut);
    for (let c = c0 + dir; c !== c1; c += dir) lay(c, (sideOut + 2) % 4, sideOut);
    lay(c1, (sideOut + 2) % 4, 2);
  }
  sc.spineCol = c1;

  for (const cell of spine) {                // scramble the route so the row starts unsolved
    if (cell.type === 'cross' || Math.random() > 0.5 + 0.4 * diff) continue;
    cell.rot = cell.type === 'straight' ? cell.solRot ^ 1 : (cell.solRot + 1 + rnd(3)) % 4;
  }
  for (const cell of row) {                  // decoys off the route: later rows only
    if (cell.onPath) continue;
    if (Math.random() < 0.07 * diff) cell.hole = true;
    else if (cell.type !== 'cross' && Math.random() < 0.08 * diff) cell.locked = true;
  }

  if (Math.random() < SC_STAR_CHANCE) {      // a glowing star on a random tile
    let cell;
    if (Math.random() < SC_STAR_ON_ROUTE) cell = spine[rnd(spine.length)];
    else {
      const free = row.filter(x => !x.hole && !x.onPath);
      cell = free.length ? free[rnd(free.length)] : spine[rnd(spine.length)];
    }
    cell.star = true; cell.starPhase = Math.random() * 6.3;
  }
}

function scEnsureRows() {
  // Expand outward every 80 rows. Each event adds `difficulty` tiles, split
  // as evenly as possible; an odd extra alternates sides so the spine stays
  // centred over a long run.
  while (sc.maxRow >= sc.nextWidthAt) {
    const add = difficulty;
    const leftAdd  = Math.floor(add / 2) + ((add % 2 === 1 && sc.expandFlip) ? 1 : 0);
    const rightAdd = add - leftAdd;
    const edge = () => ({ hole:true, locked:false, onPath:false, inUse:false,
      deg:0, star:false, starPhase:0, type:'straight', rot:0, solRot:0 });
    for (const row of sc.rows.values()) {
      for (let i = 0; i < leftAdd;  i++) row.unshift(edge());
      for (let i = 0; i < rightAdd; i++) row.push(edge());
    }
    sc.cols += add;
    sc.m.c += leftAdd;
    sc.spineCol += leftAdd;
    sc.camX += leftAdd;
    sc.nextWidthAt += 80;
    if (add % 2 === 1) sc.expandFlip = !sc.expandFlip;
  }
  while (sc.genRow <= sc.maxRow + SC_AHEAD) scGenRow();
  for (const k of sc.rows.keys()) if (k < sc.maxRow - SC_KEEP_BEHIND) sc.rows.delete(k);
}

/* ---- marble ---- */
const scDir = side => ({ x: DC[side], y: DR[side] });
function scMarblePos() {
  const m = sc.m, cx = m.c + .5, cy = m.r + .5, a = scDir(m.enter);
  const inX = cx + a.x * .5, inY = cy + a.y * .5;
  if (m.s < 0) return { x: inX + a.x * -m.s, y: inY + a.y * -m.s };          // still arriving at the tile
  if (m.s < .5) { const k = m.s / .5; return { x: inX + (cx - inX) * k, y: inY + (cy - inY) * k }; }
  const b = scDir(m.exit), k = (m.s - .5) / .5, outX = cx + b.x * .5, outY = cy + b.y * .5;
  return { x: cx + (outX - cx) * k, y: cy + (outY - cy) * k };
}

function scEnter() {
  const m = sc.m;
  const row = sc.rows.get(m.r);
  if (!row) return scDie('void');
  const cell = row[m.c];
  if (cell.hole) return scDie('hole');
  const key = m.r + ',' + m.c + ',' + m.enter;
  if (sc.seen.has(key)) return scDie('loop');
  sc.seen.add(key);
  const open = openings(cell, cell.rot);
  if (!open.includes(m.enter)) return scDie('blocked');
  m.exit = cell.type === 'cross' ? (m.enter + 2) % 4 : open.find(s => s !== m.enter);
  cell.inUse = true;                         // a tile cannot be rotated while the marble is in it
  m.in = true;
  if (m.r > sc.maxRow) sc.maxRow = m.r;
}

function scLeave() {
  const m = sc.m, row = sc.rows.get(m.r);
  if (row) row[m.c].inUse = false;
  const nc = m.c + DC[m.exit];
  if (nc < 0 || nc >= sc.cols) return scDie('fall');
  m.r += DR[m.exit]; m.c = nc; m.enter = (m.exit + 2) % 4; m.s = 0; m.in = false;
}

// Stars are collected when the marble reaches the middle of their tile.
function scTryStar() {
  const m = sc.m, row = sc.rows.get(m.r);
  if (!row || m.s < .5) return;
  const cell = row[m.c];
  if (!cell.star) return;
  cell.star = false;
  sc.stars++;
  sc.starSpeed += SC_STAR_SPEED;
  sc.bursts.push({ x: m.c + .5, y: m.r + .5, t: performance.now() });
  comboCount++;
  sc.comboLeft = SC_COMBO_MS;
  comboText.textContent = 'x' + comboCount + ' combo';
  comboFill.style.transform = 'scaleX(1)';
  comboBar.classList.toggle('visible', comboCount >= 2);
  syncComboMusic();
  if (comboCount === COMBO_MUSIC_AT) flashScreen();
}

function scStep(dt) {
  const m = sc.m;
  let move = scSpeed() * dt / 1000;
  while (move > 0 && !sc.dead) {
    if (!m.in) {
      const need = -m.s;
      if (move < need) { m.s += move; move = 0; }
      else { move -= need; m.s = 0; scEnter(); }
    } else {
      const left = 1 - m.s;
      if (move < left) { m.s += move; sc.tiles += move; scTryStar(); move = 0; }
      else { move -= left; sc.tiles += left; m.s = 1; scTryStar(); scLeave(); }
    }
  }
}

// One tick of game time: marble, combo timer, world generation.
function scAdvance(dt) {
  sc.elapsed += dt;
  scStep(dt);
  if (comboCount > 0 && !sc.dead) {
    if (chillMode) comboFill.style.transform = 'scaleX(1)';
    else {
      sc.comboLeft -= dt;
      comboFill.style.transform = 'scaleX(' + Math.max(0, sc.comboLeft / SC_COMBO_MS) + ')';
      if (sc.comboLeft <= 0) clearCombo();
    }
  }
  scEnsureRows();
}

function scDie(kind) {
  if (sc.dead) return;
  sc.dead = kind;
  const m = sc.m;
  if (kind === 'hole') { m.s = .5; m.exit = m.enter; }   // sink in the middle of the hole
  sc.fx = { kind, t0: performance.now() };
  clearCombo();
  chillToggle.classList.remove('hidden');

  timeEl.textContent = fmt(sc.elapsed);
  const depth = sc.maxRow, prev = scBest(), isBest = depth > prev;
  if (isBest) scSaveBest(depth);
  status.className = 'status lose';
  status.textContent = SC_MESSAGES[kind] + ' Depth ' + depth + '.';
  restartScrollerBtn.classList.add('visible');
  dropBtn.disabled = true;
  levelRecap.textContent = 'DEPTH ' + depth + ' · ' + timeEl.textContent + ' · ' + sc.stars + (sc.stars === 1 ? ' STAR' : ' STARS')
    + ' · BEST ' + Math.max(prev, depth) + (isBest ? ' · NEW BEST' : '');
}

/* ---- camera ---- */
function scClampCamera() {
  sc.camX = Math.max(0, Math.min(sc.cols, sc.camX));
  sc.camY = Math.max(-6, Math.min(sc.genRow, sc.camY));
}
function scDefaultZoom() {
  return Math.max(.6, Math.min(1.6, (innerWidth * .9) / (sc.cols * T), (innerHeight * .92) / (SC_VIEW_ROWS * T)));
}
// Zoom to the default and put the marble 30% of the way down the screen.
function scResetCamera() {
  zoom = scDefaultZoom();
  updateCamera();
  const p = scMarblePos();
  sc.camX = sc.cols / 2;
  sc.camY = p.y + .2 * innerHeight / (zoom * T);
  scClampCamera();
}
// Move the view by a screen-space drag, undoing the combo spin.
function scPan(dx, dy) {
  const S = zoom * T, th = spinAngle * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
  sc.camX -= (dx * cos + dy * sin) / S;
  sc.camY -= (-dx * sin + dy * cos) / S;
  scClampCamera();
}

const scPtrs = new Map(), scKeys = new Set();
let scPinch = null, scMoved = false, scSuppress = false;
panel.addEventListener('pointerdown', e => {
  if (!scrollerMode || !sc) return;
  scPtrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
  try { panel.setPointerCapture(e.pointerId); } catch (_) {}
  if (scPtrs.size === 2) {
    const [a, b] = [...scPtrs.values()];
    scPinch = { dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), zoom, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    scMoved = true;
  }
});
panel.addEventListener('pointermove', e => {
  const p = scPtrs.get(e.pointerId);
  if (!scrollerMode || !sc || !p) return;
  const nx = e.clientX, ny = e.clientY;
  if (scPtrs.size >= 2 && scPinch) {
    p.x = nx; p.y = ny;
    const [a, b] = [...scPtrs.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoom = Math.max(.3, Math.min(2.4, scPinch.zoom * Math.hypot(a.x - b.x, a.y - b.y) / scPinch.dist));
    updateCamera();
    scPan(mx - scPinch.mx, my - scPinch.my);
    scPinch.mx = mx; scPinch.my = my;
    return;
  }
  if (!scMoved && Math.hypot(nx - p.sx, ny - p.sy) > 5) { scMoved = true; panel.classList.add('dragging'); }
  if (scMoved) scPan(nx - p.x, ny - p.y);
  p.x = nx; p.y = ny;
});
function scPointerEnd(e) {
  if (!scPtrs.delete(e.pointerId)) return;
  if (scPtrs.size < 2) scPinch = null;
  for (const p of scPtrs.values()) { p.sx = p.x; p.sy = p.y; }
  if (scPtrs.size === 0) {
    panel.classList.remove('dragging');
    if (scMoved) { scSuppress = true; setTimeout(() => { scSuppress = false; }, 80); }
    scMoved = false;
  }
}
panel.addEventListener('pointerup', scPointerEnd);
panel.addEventListener('pointercancel', scPointerEnd);

const SC_KEYMAP = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'd', s: 'd' };
window.addEventListener('keydown', e => {
  const k = SC_KEYMAP[e.key];
  if (!scrollerMode || !k || e.ctrlKey || e.metaKey || e.altKey) return;
  scKeys.add(k); e.preventDefault();
});
window.addEventListener('keyup', e => { const k = SC_KEYMAP[e.key]; if (k) scKeys.delete(k); });
window.addEventListener('blur', () => scKeys.clear());
function scKeyPan(dt) {
  if (!scKeys.size) return;
  const dx = (scKeys.has('l') ? 1 : 0) - (scKeys.has('r') ? 1 : 0);   // dragging right moves the view left
  const dy = (scKeys.has('u') ? 1 : 0) - (scKeys.has('d') ? 1 : 0);
  const len = Math.hypot(dx, dy) || 1;
  scPan(dx / len * SC_PAN_PX * dt / 1000, dy / len * SC_PAN_PX * dt / 1000);
}

/* ---- drawing ---- */
function scColor(l, a) { return 'hsla(' + accentH + ',' + accentS + '%,' + Math.min(94, accentL + l) + '%,' + a + ')'; }

function scDrawStar(ctx, x, y, ph) {
  const R = .12 * (.92 + .08 * Math.sin(ph * 4));
  const g = ctx.createRadialGradient(x, y, 0, x, y, R * 2.1);
  g.addColorStop(0, scColor(18, .28)); g.addColorStop(1, scColor(18, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, R * 2.1, 0, 6.2832); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + ph * .4, rr = i % 2 ? R * .4 : R;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

function drawScroller() {
  const W = innerWidth, H = innerHeight, dpr = Math.min(1.5, window.devicePixelRatio || 1);
  if (scCanvas.width !== Math.round(W * dpr) || scCanvas.height !== Math.round(H * dpr)) {
    scCanvas.width = Math.round(W * dpr); scCanvas.height = Math.round(H * dpr);
  }
  const ctx = scCtx, S = zoom * T, now = performance.now(), t = now / 1000;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.rotate(spinAngle * Math.PI / 180); ctx.scale(S, S); ctx.translate(-sc.camX, -sc.camY);

  const rad = Math.hypot(W, H) / 2 / S + 1;
  const r0 = Math.floor(sc.camY - rad), r1 = Math.ceil(sc.camY + rad);
  ctx.lineWidth = .24; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  for (let r = r0; r <= r1; r++) {
    const row = sc.rows.get(r);
    if (!row) continue;
    for (let c = 0; c < sc.cols; c++) {
      const cell = row[c];
      if (cell.hole) continue;
      const cx = c + .5, cy = r + .5;
      ctx.strokeStyle = cell.inUse ? '#fff' : cell.locked ? '#777d77' : sc.accent;
      ctx.beginPath();
      if (cell.type === 'cross') { ctx.moveTo(cx, r); ctx.lineTo(cx, r + 1); ctx.moveTo(c, cy); ctx.lineTo(c + 1, cy); }
      else if (cell.type === 'straight') {
        if (cell.rot % 2 === 0) { ctx.moveTo(cx, r); ctx.lineTo(cx, r + 1); } else { ctx.moveTo(c, cy); ctx.lineTo(c + 1, cy); }
      } else {
        const a = cell.rot % 4, b = (a + 1) % 4;
        ctx.moveTo(cx + DC[a] * .5, cy + DR[a] * .5); ctx.lineTo(cx, cy); ctx.lineTo(cx + DC[b] * .5, cy + DR[b] * .5);
      }
      ctx.stroke();
    }
  }
  for (let r = r0; r <= r1; r++) {           // stars sit on top of the pipes
    const row = sc.rows.get(r);
    if (!row) continue;
    for (let c = 0; c < sc.cols; c++) if (row[c].star) scDrawStar(ctx, c + .5, r + .5, t + row[c].starPhase);
  }

  sc.bursts = sc.bursts.filter(b => now - b.t < 450);
  for (const b of sc.bursts) {
    const age = (now - b.t) / 450;
    ctx.strokeStyle = scColor(26, 1 - age); ctx.lineWidth = .05;
    ctx.beginPath(); ctx.arc(b.x, b.y, .2 + age * .8, 0, 6.2832); ctx.stroke();
  }

  const p = scMarblePos();
  let scale = 1, alpha = 1;
  if (sc.fx) {
    const age = Math.min(1, (now - sc.fx.t0) / 300);
    scale = sc.fx.kind === 'hole' ? 1 - age : (sc.fx.kind === 'fall' || sc.fx.kind === 'void') ? 1 - .2 * age : 1 + .8 * age;
    alpha = 1 - age;
  }
  if (alpha > 0) {
    ctx.globalAlpha = alpha;
    ctx.shadowColor = sc.accent; ctx.shadowBlur = 12;
    ctx.fillStyle = scColor(22, 1);
    ctx.beginPath(); ctx.arc(p.x, p.y, 9 / S * scale, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
}

function scUpdateBadge() {
  badge.textContent = 'SCROLLER  ·  DIFF ' + difficulty + '  ·  ' + sc.cols + ' WIDE  ·  SPEED ' + scSpeed().toFixed(1) + '  ·  BEST ' + scBest() + (chillMode ? '  ·  CHILL' : '');
}

function fitScroller() {
  T = window.innerWidth < 620 ? 44 : 60;
  level.cols = sc.cols; level.rows = SC_VIEW_ROWS;      // the combo sky effects size themselves from `level`
  updateCamera();
}

/* ---- menu, start and loop ---- */
function buildScrollerMenu() {
  runId++;                                   // cancels any ordinary marble still animating
  busy = false; won = false; marbles = 0; lastRunPath = [];
  document.body.classList.remove('won', 'frenzy-mode');
  board.classList.remove('busy');
  resetClock();
  clearCombo();
  previewDifficulty(boardValue);             // fresh accent colour for every run
  const cols = 3;
  level = { cols, rows: SC_VIEW_ROWS, start: { r: 0, c: 0 }, target: 0, cells: [] };   // stand-in for the sky effects
  sc = { cols, rows: new Map(), genRow: 0, spineCol: Math.floor(cols / 2), nextWidthAt: 80, expandFlip: false,
    camX: cols / 2, camY: 0, tiles: 0, maxRow: 0, elapsed: 0, seen: new Set(),
    started: false, dead: null, hudAt: 0, lastDepth: -1, stars: 0, starSpeed: 0, comboLeft: 0, bursts: [], fx: null,
    accent: 'hsl(' + accentH + ' ' + accentS + '% ' + accentL + '%)',
    m: { r: 0, c: Math.floor(cols / 2), enter: 0, exit: 2, s: -.5, in: false } };
  scEnsureRows();
  T = window.innerWidth < 620 ? 44 : 60;
  scResetCamera();

  marblesEl.previousElementSibling.textContent = 'Depth';
  marblesEl.textContent = '0';
  dropBtn.disabled = false;
  restartScrollerBtn.classList.remove('visible');
  scrollerToggle.classList.remove('hidden');
  chillToggle.classList.remove('hidden');
  // The menu is the last chance to pick a difficulty: keep it visible here
  // so a run can be configured before the first drop.
  diffPanel.classList.remove('hidden');
  newBtn.classList.remove('primary');
  status.className = 'status';
  status.textContent = 'Scroller mode: the camera is free — drag or use the arrow keys to pan, zoom as needed, and keep the route in view. Collect glowing stars for combo and speed.';
  updateDiffHint();
  scUpdateBadge();
  scStartLoop();
}

function scStartLoop() {
  const mine = sc;
  let last = performance.now();
  function frame(now) {
    if (sc !== mine || !scrollerMode) return;
    const dt = Math.min(50, now - last); last = now;
    if (mine.started && !mine.dead) scAdvance(dt);
    scKeyPan(dt);
    if (mine.maxRow !== mine.lastDepth) { mine.lastDepth = mine.maxRow; marblesEl.textContent = mine.maxRow; }
    if (now - mine.hudAt > 250) {
      mine.hudAt = now;
      if (mine.started && !mine.dead) timeEl.textContent = fmt(mine.elapsed);
      scUpdateBadge();
    }
    drawScroller();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function scrollerDrop() {
  if (!sc || sc.dead || sc.started) return;
  sc.started = true;
  scrollerToggle.classList.add('hidden');
  restartScrollerBtn.classList.remove('visible');
  dropBtn.disabled = true;
  chillToggle.classList.add('hidden');       // chill is chosen before the run
  diffPanel.classList.add('hidden');         // difficulty is locked in the moment the run begins
  status.className = 'status';
  status.textContent = 'Rotate the tiles ahead of the marble.';
}

function scrollerClick(e) {
  if (!sc || sc.dead || scSuppress) return;
  const S = zoom * T, th = spinAngle * Math.PI / 180, cos = Math.cos(th), sin = Math.sin(th);
  const dx = e.clientX - innerWidth / 2, dy = e.clientY - innerHeight / 2;
  const u = (dx * cos + dy * sin) / S + sc.camX, v = (-dx * sin + dy * cos) / S + sc.camY;
  const c = Math.floor(u), r = Math.floor(v);
  if (c < 0 || c >= sc.cols) return;
  const row = sc.rows.get(r);
  if (!row) return;
  const cell = row[c];
  if (cell.hole || cell.locked || cell.type === 'cross' || cell.inUse) return;
  cell.rot = (cell.rot + 1) % 4;
}

restartScrollerBtn.addEventListener('click', () => {
  if (!scrollerMode || !sc || !sc.dead) return;
  // Return to the actual base-game Level 1 menu, with all mode controls restored.
  scrollerMode = false;
  scrollerToggle.setAttribute('aria-pressed', 'false');
  scrollerToggle.classList.remove('hidden');
  chillToggle.classList.remove('hidden');
  document.body.classList.remove('scroller-mode');
  scKeys.clear(); scPtrs.clear();
  sc = null;
  levelRecap.textContent = '';
  marblesEl.previousElementSibling.textContent = 'Marbles';
  restartScrollerBtn.classList.remove('visible');
  updateDiffHint();
  newLevel();
});

scrollerToggle.addEventListener('click', () => {
  if (boardValue !== 4) return;              // like chill mode, only offered on the menu board
  scrollerMode = !scrollerMode;
  scrollerToggle.setAttribute('aria-pressed', scrollerMode ? 'true' : 'false');
  document.body.classList.toggle('scroller-mode', scrollerMode);
  levelRecap.textContent = '';
  updateDiffHint();
  if (scrollerMode) {
    buildScrollerMenu();
  } else {
    clearCombo();
    sc = null; scKeys.clear(); scPtrs.clear();
    marblesEl.previousElementSibling.textContent = 'Marbles';
    newLevel();
  }
});

/* ---------- combo music ----------
   From combo 10 the track loops underneath the game. It arrives deliberately
   lo-fi — silent, low-passed and pitched down to 0.7 — then, for as long as the
   combo survives, it climbs to full volume, an open filter and normal speed
   over COMBO_MUSIC_RAMP. Break the combo and it resets to the top.

   On top of that long ramp sits a short muffle: clearing a level slams
   music.muffle to 1, which pulls the ramp's shape down for an instant before
   it decays back over COMBO_MUSIC_MUFFLE_MS. The dip is deliberately partial —
   MUFFLE_DEPTH controls how far the tone (filter + pitch) drops, and the
   gentler MUFFLE_VOLUME controls the volume. Because the ramp and the muffle
   multiply, the effect works the same whether the track is three seconds or
   three minutes into its progression, and the track never cuts out. */
const COMBO_MUSIC_AT            = 10;      // combo level that brings the music in
const COMBO_MUSIC_RAMP          = 120000;  // 2 minutes from lo-fi to full fidelity
const COMBO_MUSIC_MUFFLE_MS     = 5000;    // level win: hard muffle, 5s recovery
const COMBO_MUSIC_MUFFLE_DEPTH  = 0.50;    // tone dip (filter + pitch). 0 = no dip, 1 = slam to full lo-fi
const COMBO_MUSIC_MUFFLE_VOLUME = 0.30;    // volume dip specifically — kept shallow so the track never drops out
const COMBO_MUSIC_RATE          = 0.7;     // starting playback rate
const COMBO_MUSIC_CUT           = 320;     // starting low-pass corner (Hz)
const COMBO_MUSIC_OPEN          = 18000;   // fully unmuffled corner (Hz)
const COMBO_MUSIC_VOL           = 0.9;     // normal volume once the ramp finishes
const COMBO_MUSIC_PITCH         = false;   // true = hold pitch while slowing down

const music = { el: null, ctx: null, src: null, lp: null, gain: null, analyser: null, freq: null, ok: false, on: false, t: 0, muffle: 0, stopTimer: null };

function initMusic() {
  if (music.el) return;
  const el = new Audio('combo.mp3');
  el.loop = true;
  el.preload = 'auto';
  music.el = el;
  try {
    el.preservesPitch = COMBO_MUSIC_PITCH;
    el.mozPreservesPitch = COMBO_MUSIC_PITCH;
    el.webkitPreservesPitch = COMBO_MUSIC_PITCH;
  } catch (_) {}
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    const ctx = new Ctx();
    const src = ctx.createMediaElementSource(el);
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = COMBO_MUSIC_CUT;
    lp.Q.value = 0.6;
    const gain = ctx.createGain();
    gain.gain.value = 0;
    src.connect(lp).connect(gain).connect(ctx.destination);
    // Tapped after the filter, so the visualiser tracks what is actually heard.
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.72;
    lp.connect(analyser);
    const freq = new Uint8Array(analyser.frequencyBinCount);
    Object.assign(music, { ctx, src, lp, gain, analyser, freq, ok: true });
  } catch (_) { music.ok = false; }
}

function startMusic() {
  initMusic();
  if (!music.ok || music.on) return;
  if (music.ctx.state === 'suspended') music.ctx.resume().catch(() => {});
  clearTimeout(music.stopTimer);
  const now = music.ctx.currentTime;
  music.on = true;
  music.t = 0;
  music.muffle = 0;                                  // fresh start is never muffled
  music.gain.gain.cancelScheduledValues(now);
  music.gain.gain.setValueAtTime(0, now);            // start silent
  music.lp.frequency.cancelScheduledValues(now);
  music.lp.frequency.setValueAtTime(COMBO_MUSIC_CUT, now); // start muffled
  music.el.playbackRate = COMBO_MUSIC_RATE;          // start slowed
  try { music.el.currentTime = 0; } catch (_) {}
  const p = music.el.play();
  if (p && p.catch) p.catch(() => {});
}

function stopMusic() {
  if (!music.ok || !music.on) return;
  music.on = false;
  music.t = 0;
  music.muffle = 0;
  const now = music.ctx.currentTime;
  music.gain.gain.cancelScheduledValues(now);
  music.gain.gain.setValueAtTime(music.gain.gain.value, now);
  music.gain.gain.setTargetAtTime(0, now, 0.05);     // short anti-click fade
  music.lp.frequency.setValueAtTime(COMBO_MUSIC_CUT, now);
  music.el.playbackRate = COMBO_MUSIC_RATE;
  clearTimeout(music.stopTimer);
  music.stopTimer = setTimeout(() => { if (!music.on) music.el.pause(); }, 260);
}

function syncComboMusic() {
  if (comboCount >= COMBO_MUSIC_AT) startMusic(); else stopMusic();
}

function tickMusic(dt) {
  if (!music.ok || !music.on) return;
  music.t = Math.min(1, music.t + dt / COMBO_MUSIC_RAMP);
  // Linear decay from the level-win slam back to clean over 5 seconds.
  music.muffle = Math.max(0, music.muffle - dt / COMBO_MUSIC_MUFFLE_MS);
  const now = music.ctx.currentTime;

  // Tone (filter + pitch) dips by MUFFLE_DEPTH; volume by the gentler
  // MUFFLE_VOLUME. Both still ride on music.t, so a win sounds the same at
  // combo 10 or combo 40 — but the track only dulls, it never cuts out.
  const tone = music.t * (1 - music.muffle * COMBO_MUSIC_MUFFLE_DEPTH);
  const vol  = music.t * (1 - music.muffle * COMBO_MUSIC_MUFFLE_VOLUME);

  music.gain.gain.setTargetAtTime(COMBO_MUSIC_VOL * vol, now, 0.08);
  music.lp.frequency.setTargetAtTime(
    COMBO_MUSIC_CUT * Math.pow(COMBO_MUSIC_OPEN / COMBO_MUSIC_CUT, tone), now, 0.15);
  music.el.playbackRate = COMBO_MUSIC_RATE + (1 - COMBO_MUSIC_RATE) * tone;
}

/* ---------- grid spin (per-frame) ----------
   Eases the rotation speed up while the combo is at or above COMBO_MUSIC_AT,
   and back down when it drops. Once the spin has bled off, the board glides
   upright along the shortest arc so it never rests at an odd angle.
   spinDir carries the per-level coin toss, so the maze reverses direction
   every time a board is cleared. */
function tickSpin(dt) {
  const wantSpin = comboCount >= COMBO_MUSIC_AT;
  const targetSpeed = wantSpin ? SPIN_DEG_PER_SEC * spinDir : 0;
  spinSpeed += (targetSpeed - spinSpeed) * Math.min(1, dt / 250);
  spinAngle += spinSpeed * dt / 1000;

  if (!wantSpin && Math.abs(spinSpeed) < 0.1) {
    // Wrap to [-180, 180] so we always unwind the short way.
    let a = ((spinAngle + 180) % 360 + 360) % 360 - 180;
    a *= Math.pow(0.9, dt / 16.7);
    if (Math.abs(a) < 0.08) { a = 0; spinSpeed = 0; }
    spinAngle = a;
  }

  const rounded = Math.round(spinAngle * 100) / 100;
  if (rounded !== spinLastSet) {
    board.style.setProperty('--spin', rounded + 'deg');
    spinLastSet = rounded;
  }
}

/* ---------- ambient starry sky (combo 12+) ----------
   Little square "stars" scattered across the viewport. Each spawns with a
   random size and peak alpha, fades in, holds for a random 2–8 seconds while
   softly twinkling, then dims out. Screen-space (not board-space), so they
   read as distant sky rather than something the maze drags around with it.
   Sits at the very back — behind the board glow and the shooting stars. */
const COMBO_AMBIENT_AT = 12;
const ambientCanvas = document.getElementById('ambientStars');
const ambientCtx = ambientCanvas.getContext('2d', { alpha: true, desynchronized: true });
const ambientStars = [];
let ambientDpr = 1, ambientSpawnAccum = 0, ambientDirty = false;

function sizeAmbient() {
  ambientDpr = Math.min(1.5, window.devicePixelRatio || 1);
  ambientCanvas.width  = Math.round(innerWidth  * ambientDpr);
  ambientCanvas.height = Math.round(innerHeight * ambientDpr);
  ambientCanvas.style.width  = innerWidth  + 'px';
  ambientCanvas.style.height = innerHeight + 'px';
}
sizeAmbient();
window.addEventListener('resize', sizeAmbient);

function spawnAmbient() {
  const fadeIn  = 0.4 + Math.random() * 0.7;
  const hold    = 2 + Math.random() * 6;
  const fadeOut = 1.0 + Math.random() * 1.6;
  ambientStars.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    size: 1.5 + Math.random() * 3.2,        // little squares, 1.5–4.7 px
    peak: 0.22 + Math.random() * 0.55,
    t: 0,
    fadeIn, hold, fadeOut,
    life: fadeIn + hold + fadeOut,
    phase: Math.random() * Math.PI * 2,     // twinkle offset, so they desync
  });
}

function tickAmbient(dt) {
  const active = comboCount >= COMBO_AMBIENT_AT;

  if (!active && !ambientStars.length) {
    if (ambientDirty) {
      ambientCtx.setTransform(ambientDpr, 0, 0, ambientDpr, 0, 0);
      ambientCtx.clearRect(0, 0, innerWidth, innerHeight);
      ambientDirty = false;
    }
    return;
  }

  ambientCtx.setTransform(ambientDpr, 0, 0, ambientDpr, 0, 0);
  ambientCtx.clearRect(0, 0, innerWidth, innerHeight);
  ambientDirty = true;

  if (active) {
    // Trickle in faster as the combo climbs, so a long run fills the sky.
    const rate = Math.min(5, 1.8 + (comboCount - COMBO_AMBIENT_AT) * 0.25);
    ambientSpawnAccum += (dt / 1000) * rate;
    let guard = 0;
    while (ambientSpawnAccum >= 1 && guard++ < 6) {
      ambientSpawnAccum -= 1;
      spawnAmbient();
    }
  } else {
    ambientSpawnAccum = 0;
  }

  if (!ambientStars.length) return;

  const [r, g, b] = hslToRgb(accentH, accentS, accentL);
  const dts = dt / 1000;

  for (let i = ambientStars.length - 1; i >= 0; i--) {
    const s = ambientStars[i];
    s.t += dts;
    if (s.t >= s.life) { ambientStars.splice(i, 1); continue; }

    // Piecewise envelope: rise, hold, fall.
    let a;
    if (s.t < s.fadeIn) a = s.t / s.fadeIn;
    else if (s.t < s.fadeIn + s.hold) a = 1;
    else a = 1 - (s.t - s.fadeIn - s.hold) / s.fadeOut;

    // Gentle twinkle so held stars shimmer rather than sit dead still.
    const twinkle = 1 + 0.18 * Math.sin(s.t * 5.5 + s.phase);
    const alpha = Math.max(0, a * s.peak * twinkle);
    if (alpha < 0.008) continue;

    ambientCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ambientCtx.fillRect(s.x - s.size * 0.5, s.y - s.size * 0.5, s.size, s.size);
  }
}

/* ---------- shooting stars (combo 15+) ----------
   The streaks live in *board* coordinates. Every frame the canvas re-applies
   the board's own transform — translate to viewport centre + pan, rotate by
   spinAngle, scale by zoom, then shift by -board/2 — so they inherit the
   maze's rotation for free. Colours are rebuilt from the same HSL numbers
   previewDifficulty pushes into --accent, so the stars always match the pipes.
   The layer sits at z-index 0 (behind the board) to keep the pipes readable. */
const COMBO_STARS_AT = 15;
const starfield = document.getElementById('starfield');
const starCtx = starfield.getContext('2d', { alpha: true, desynchronized: true });
const stars = [];
let starSpawnAccum = 0, starDpr = 1, starsDirty = false;

function sizeStarfield() {
  starDpr = Math.min(1.5, window.devicePixelRatio || 1);
  starfield.width  = Math.round(innerWidth  * starDpr);
  starfield.height = Math.round(innerHeight * starDpr);
  starfield.style.width  = innerWidth  + 'px';
  starfield.style.height = innerHeight + 'px';
}
sizeStarfield();
window.addEventListener('resize', sizeStarfield);

function spawnStar() {
  const bw = level.cols * T, bh = level.rows * T;
  // Start above the board so the streak enters the frame from off-screen.
  const x = -bw * 0.40 + Math.random() * bw * 1.80;
  const y = -bh * 0.45 - Math.random() * bh * 0.55;
  const dir = Math.PI / 2 + (Math.random() - 0.5) * 0.7;   // mostly straight down
  stars.push({
    x, y, dir,
    speed: 260 + Math.random() * 420,                      // board px / second
    len:   T * (1.0 + Math.random() * 2.4),                // tail length, board px
    w:     T * (0.030 + Math.random() * 0.05),             // stroke width, board px
    t: 0,
    life: 1.5 + Math.random() * 1.4,
  });
}

function tickStars(dt) {
  const active = comboCount >= COMBO_STARS_AT && !!level;

  // Nothing to spawn, nothing alive, nothing left on screen → skip entirely.
  if (!active && !stars.length) {
    if (starsDirty) {
      starCtx.setTransform(starDpr, 0, 0, starDpr, 0, 0);
      starCtx.clearRect(0, 0, innerWidth, innerHeight);
      starsDirty = false;
    }
    return;
  }

  starCtx.setTransform(starDpr, 0, 0, starDpr, 0, 0);
  starCtx.clearRect(0, 0, innerWidth, innerHeight);
  starsDirty = true;

  if (active) {
    // Spawn rate climbs with the combo so late runs feel denser.
    const rate = Math.min(7, 1.6 + (comboCount - COMBO_STARS_AT) * 0.35);
    starSpawnAccum += (dt / 1000) * rate;
    let guard = 0;
    while (starSpawnAccum >= 1 && guard++ < 8) { starSpawnAccum -= 1; spawnStar(); }
  } else {
    starSpawnAccum = 0;
  }

  if (!stars.length || !level) return;

  const dts = dt / 1000;
  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.t += dts;
    if (s.t >= s.life) { stars.splice(i, 1); continue; }
    s.x += Math.cos(s.dir) * s.speed * dts;
    s.y += Math.sin(s.dir) * s.speed * dts;
  }
  if (!stars.length) return;

  // Mirror of the board's CSS transform, so stars share the maze's world.
  const bw = level.cols * T, bh = level.rows * T;
  starCtx.translate(innerWidth / 2 + cameraX, innerHeight / 2 + cameraY);
  starCtx.rotate(spinAngle * Math.PI / 180);
  starCtx.scale(zoom, zoom);
  starCtx.translate(-bw / 2, -bh / 2);

  const [r, g, b] = hslToRgb(accentH, accentS, accentL);
  starCtx.lineCap = 'butt';   // flat rectangular ends, as requested

  for (const s of stars) {
    const p = s.t / s.life;
    const alpha = Math.min(1, p * 5) * Math.min(1, (1 - p) * 2.6);
    if (alpha <= 0.004) continue;

    const dx = Math.cos(s.dir), dy = Math.sin(s.dir);
    const hx = s.x,             hy = s.y;                    // head
    const tx = s.x - dx * s.len, ty = s.y - dy * s.len;      // tail

    const grad = starCtx.createLinearGradient(hx, hy, tx, ty);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0)`);

    starCtx.strokeStyle = grad;
    // Constant-ish screen thickness once the camera pulls back a long way.
    starCtx.lineWidth = s.w / Math.max(0.5, zoom);
    starCtx.beginPath();
    starCtx.moveTo(hx, hy);
    starCtx.lineTo(tx, ty);
    starCtx.stroke();
  }
}

/* ---------- beat visualiser + vignette ----------
   Two spectrum strips fed by the analyser above — one hugging the bottom edge,
   one mirrored at the top so its bars hang downwards. Each kick drum fires a
   pulse that decays; the strips fade in at the combo-10 threshold and keep
   brightening for VIZ_RAMP, but never past a low ceiling so the pipes stay
   readable. The vignette uses the same pulse to glow around the screen edges;
   its beat response is deliberately strong so kicks read as a hit. */
const VIZ_RAMP      = 240000;  // 4 minutes from dim to its brightest
const VIZ_ALPHA_MIN = 0.18;    // baseline visibility once music is running (was 0.07 — too faint)
const VIZ_ALPHA_MAX = 0.42;    // final ceiling — still deliberately restrained
const VIZ_HEIGHT    = 118;     // logical height of the strip in CSS pixels

const vizCanvas    = document.getElementById('viz');
const vizCtx       = vizCanvas.getContext('2d', { alpha: true, desynchronized: true });
const vizTopCanvas = document.getElementById('vizTop');
const vizTopCtx    = vizTopCanvas.getContext('2d', { alpha: true, desynchronized: true });
const vignetteEl   = document.getElementById('vignette');

let vizW = 0, vizH = VIZ_HEIGHT;
let vizT = 0, vizAlpha = 0, vizTarget = 0;
let bassAvg = 0.015, bassSmooth = 0, pulse = 0, lastBeatAt = 0;
let vigSmooth = 0;

function sizeViz() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  vizW = window.innerWidth;
  vizH = VIZ_HEIGHT;
  for (const cv of [vizCanvas, vizTopCanvas]) {
    cv.width  = Math.round(vizW * dpr);
    cv.height = Math.round(vizH * dpr);
    cv.style.width  = vizW + 'px';
    cv.style.height = vizH + 'px';
  }
  vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vizTopCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeViz();
window.addEventListener('resize', sizeViz);

function vizTick(dt, now) {
  const running = music.ok && music.on && music.el && !music.el.paused;

  if (running) {
    vizT = Math.min(1, vizT + dt / VIZ_RAMP);
    vizTarget = VIZ_ALPHA_MIN + (VIZ_ALPHA_MAX - VIZ_ALPHA_MIN) * vizT;
  } else {
    vizT = 0;
    vizTarget = 0;
  }
  vizAlpha += (vizTarget - vizAlpha) * Math.min(1, dt / 200);

  // Always clear both strips so the mirrored copy mirrors everything exactly.
  vizCtx.clearRect(0, 0, vizW, vizH);
  vizTopCtx.clearRect(0, 0, vizW, vizH);

  // Sample the spectrum and look for a kick in the bass band.
  let data = null;
  if (running && music.analyser) {
    data = music.freq;
    music.analyser.getByteFrequencyData(data);
    let bass = 0;
    for (let i = 1; i <= 5; i++) bass += data[i];
    bass = Math.pow(bass / (5 * 255), 1.35);
    bassSmooth += (bass - bassSmooth) * 0.28;
    bassAvg += (bass - bassAvg) * 0.012;
    if (bass > bassAvg * 1.32 && bass > 0.12 && now - lastBeatAt > 170) {
      lastBeatAt = now;
      pulse = Math.min(1.5, pulse + 0.85);
    }
  }
  pulse *= Math.pow(0.9, dt / 16.7);

  // Vignette: boosted beat response. The baseline is kept modest so the
  // edges don't dominate at rest, but each kick pushes the multiplier up
  // hard, so hits read as a sharp flare rather than a slow swell.
  const vNorm = VIZ_ALPHA_MAX > 0 ? Math.min(1, vizAlpha / VIZ_ALPHA_MAX) : 0;
  const beat = Math.min(1.25, pulse);
  const vigTarget = running ? Math.min(1, vNorm * (0.22 + beat * 1.05)) : 0;
  vigSmooth += (vigTarget - vigSmooth) * Math.min(1, dt / 55);
  vignetteEl.style.opacity = vigSmooth < 0.003 ? '0' : vigSmooth.toFixed(3);

  if (!data || vizAlpha < 0.004) return;

  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#a5d84b';
  const bars = Math.max(22, Math.min(64, Math.round(vizW / 15)));
  const slot = vizW / bars;
  const maxBin = Math.min(data.length - 1, 240);
  const ceiling = vizH * 0.9;

  // Paint the identical strip into both canvases. The top one is flipped by
  // CSS (scaleY -1, origin centre), so what lands at the bottom of its box
  // appears at the very top of the screen, bars pointing down.
  for (const ctx of [vizCtx, vizTopCtx]) {
    ctx.fillStyle = accent;
    for (let i = 0; i < bars; i++) {
      const bin = Math.max(1, Math.round(Math.pow(maxBin, i / (bars - 1))));
      const v = Math.pow((data[bin] || 0) / 255, 1.3);
      const h = Math.min(ceiling, (v * 0.8 + pulse * 0.45) * ceiling);
      if (h < 1.2) continue;
      ctx.globalAlpha = vizAlpha * (0.3 + 0.7 * (h / ceiling));
      ctx.fillRect(i * slot, vizH - h, Math.max(1, slot - 2), h);
    }
    // Slim beat bar welded to the very edge of the strip.
    ctx.globalAlpha = vizAlpha * (0.55 + 0.45 * Math.min(1, pulse));
    ctx.fillRect(0, vizH - 2.5, vizW, 2.5);
    ctx.globalAlpha = 1;
  }
}

/* ---------- ambient board glow (combo 13+) ----------
   A radial gradient that lives behind the pipes and is centred on the board's
   screen position. Overall loudness sets its resting level; each kick spikes
   it much harder. It fades in only once the combo reaches COMBO_GLOW_AT, and
   disappears when the combo drops below it. Because the element is a fixed-
   size square (re-sized from JS whenever zoom changes) and only translated,
   the browser never has to lay out a scaled gradient mid-beat — the pulse is
   purely an opacity change. */
const COMBO_GLOW_AT   = 13;
const GLOW_ALPHA_BASE = 0.06;   // resting brightness once active
const GLOW_ALPHA_BEAT = 0.65;   // extra brightness on a kick — the money shot
const boardGlow = document.getElementById('boardGlow');
let glowAlpha = 0, glowSize = 0;

function updateGlowGradient() {
  const [r, g, b] = hslToRgb(accentH, accentS, accentL);
  boardGlow.style.background = 'radial-gradient(circle, ' +
    'rgba(' + r + ',' + g + ',' + b + ',0.85) 0%, ' +
    'rgba(' + r + ',' + g + ',' + b + ',0.42) 26%, ' +
    'rgba(' + r + ',' + g + ',' + b + ',0.14) 50%, ' +
    'rgba(' + r + ',' + g + ',' + b + ',0) 75%)';
}

function tickBoardGlow(dt) {
  const active = comboCount >= COMBO_GLOW_AT && !!level;
  const running = music.ok && music.on && music.el && !music.el.paused;

  let target = 0;
  if (active && running && music.analyser) {
    // Sustained brightness from overall loudness, sharper spikes from kicks.
    const freq = music.freq;
    const step = Math.max(1, Math.floor(freq.length / 96));
    let loud = 0, n = 0;
    for (let i = 2; i < freq.length; i += step) { loud += freq[i]; n++; }
    loud = n ? Math.pow(loud / n / 255, 1.15) : 0;
    // pulse goes up to 1.5; cap at 1.2 so kicks have much more headroom than
    // sustained loudness, giving a hard snap on every hit.
    const beat = Math.min(1.2, pulse);
    target = GLOW_ALPHA_BASE + GLOW_ALPHA_BEAT * Math.max(loud * 0.55, beat * 0.95);
  }

  // Asymmetric attack/release: rise fast on a kick, fall a bit slower.
  const rate = target > glowAlpha ? 70 : 160;
  glowAlpha += (target - glowAlpha) * Math.min(1, dt / rate);

  if (glowAlpha < 0.004) {
    if (boardGlow.style.opacity !== '0') boardGlow.style.opacity = '0';
    return;
  }
  boardGlow.style.opacity = glowAlpha.toFixed(3);

  // Keep it centred on the board in screen space. Size only changes when the
  // zoom does, so guard the write — setting width/height forces layout.
  const bw = level.cols * T, bh = level.rows * T;
  const size = Math.max(bw, bh) * zoom * 1.7;
  if (Math.abs(size - glowSize) > 0.5) {
    glowSize = size;
    boardGlow.style.width  = size + 'px';
    boardGlow.style.height = size + 'px';
  }
  boardGlow.style.left = (innerWidth  / 2 + cameraX) + 'px';
  boardGlow.style.top  = (innerHeight / 2 + cameraY) + 'px';
}

/* ---------- combo flash ---------- */
const flashEl = document.getElementById('flash');
function flashScreen() {
  flashEl.classList.remove('fire');
  void flashEl.offsetWidth;      // restart the animation
  flashEl.classList.add('fire');
}

let musicLast = performance.now();
function musicFrame(now) {
  const dt = Math.min(250, now - musicLast);
  musicLast = now;
  tickMusic(dt);
  vizTick(dt, now);
  tickAmbient(dt);
  tickStars(dt);
  tickBoardGlow(dt);
  tickSpin(dt);
  requestAnimationFrame(musicFrame);
}
requestAnimationFrame(musicFrame);

/* Browsers only let audio start from a gesture; warm the context up on the
   first tap so it is already running by the time combo 10 arrives. */
['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
  window.addEventListener(ev, () => {
    initMusic();
    if (music.ctx && music.ctx.state === 'suspended') music.ctx.resume().catch(() => {});
  }, { passive: true })
);

newLevel();
</script>
