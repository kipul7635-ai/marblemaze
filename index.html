<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap');

  /* Register --accent as a real <color> so it can be transitioned */
  @property --accent {
    syntax: '<color>';
    inherits: true;
    initial-value: #22b573;
  }

  :root {
    --ink: #0d3b5c;
    --ink-soft: #3f6a88;

    --accent: #22b573;
    --accent-hi: color-mix(in srgb, var(--accent) 55%, #fff);
    --accent-lo: color-mix(in srgb, var(--accent) 72%, #04243c);
    --accent-ink: color-mix(in srgb, var(--accent) 55%, #05223a);

    --correct-hi: #5fe08a;
    --correct-lo: #14933f;
    --present-hi: #ffe27a;
    --present-lo: #f2a900;
    --absent-hi: #9db6c9;
    --absent-lo: #6b869c;

    /* Glossy highlight laid over any coloured gel */
    --gloss: linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 50%, rgba(255,255,255,0) 51%);

    transition: --accent 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: linear-gradient(180deg, #4db8f2 0%, #8fd8fb 38%, #d6f3ff 72%, #e9fbff 100%) fixed;
    color: var(--ink);
    font-family: 'Nunito Sans', 'Segoe UI', 'Frutiger', 'Trebuchet MS', sans-serif;
    font-size: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px 120px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Sky scenery ---------- */
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .sun {
    position: absolute;
    top: -38vmax;
    left: 50%;
    width: 90vmax;
    height: 90vmax;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(255,255,255,.4) 22%, rgba(255,255,255,0) 58%);
  }
  .cloud {
    position: absolute;
    width: 320px;
    height: 120px;
    background:
      radial-gradient(70px 42px at 26% 62%, #fff 55%, transparent 100%),
      radial-gradient(80px 58px at 50% 44%, #fff 55%, transparent 100%),
      radial-gradient(64px 40px at 76% 64%, #fff 55%, transparent 100%);
    filter: blur(5px);
    opacity: .85;
  }
  .cloud.c1 { top: 9vh;  left: -60px; }
  .cloud.c2 { top: 26vh; right: -80px; transform: scale(1.3); opacity: .7; }
  .cloud.c3 { top: 52vh; left: 8vw;   transform: scale(.8);  opacity: .6; }

  .hill {
    position: absolute;
    border-radius: 50%;
    background: linear-gradient(180deg, #b5f283 0%, #4fc25a 45%, #1f8f3e 100%);
    box-shadow: inset 0 14px 30px rgba(255,255,255,.45);
  }
  .hill.h1 { bottom: -22vh; left: -25vw; width: 90vw;  height: 44vh; }
  .hill.h2 { bottom: -26vh; right: -30vw; width: 110vw; height: 42vh;
             background: linear-gradient(180deg, #8de86a 0%, #36b24d 50%, #1a8238 100%); }

  .bubble {
    position: absolute;
    bottom: -90px;
    left: var(--x);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.85);
    background:
      radial-gradient(circle at 30% 28%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,0) 26%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.08) 55%, rgba(120,215,255,.35) 100%);
    box-shadow: inset 0 -8px 14px rgba(255,255,255,.4), 0 4px 14px rgba(30,140,220,.18);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise {
    to { transform: translate(24px, -118vh); }
  }

  /* ---------- Glass card ---------- */
  .app {
    width: min(880px, 100%);
    position: relative;
    z-index: 1;
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,.64), rgba(255,255,255,.36) 24%, rgba(255,255,255,.42));
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    backdrop-filter: blur(20px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      0 30px 60px -22px rgba(8, 80, 140, .5),
      0 0 0 6px rgba(255,255,255,.2),
      inset 0 1px 0 #fff,
      inset 0 -3px 10px rgba(30,140,220,.16),
      0 0 90px -14px color-mix(in srgb, var(--accent) 50%, transparent);
  }
  .app::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 130px;
    border-radius: 32px 32px 50% 50% / 32px 32px 44px 44px;
    background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0));
    pointer-events: none;
  }

  .window-body { position: relative; padding: 30px 30px 32px; }

  /* ---------- Header ---------- */
  header { text-align: center; margin-bottom: 12px; }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand-text { text-align: left; }

  .orb {
    position: relative;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    background:
      radial-gradient(circle at 50% 125%, var(--accent-hi), transparent 62%),
      linear-gradient(180deg, var(--accent-hi), var(--accent) 48%, var(--accent-lo));
    box-shadow:
      0 10px 20px -6px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 -7px 12px rgba(255,255,255,.35),
      inset 0 0 0 1px rgba(255,255,255,.65);
    color: #fff;
    font: 700 2.15rem/1 Georgia, 'Times New Roman', serif;
    text-shadow: 0 1px 3px rgba(0,30,60,.45);
  }
  .orb::after {
    content: '';
    position: absolute;
    top: 5%; left: 14%; right: 14%;
    height: 46%;
    border-radius: 50% / 62%;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.08));
  }
  .orb span { position: relative; z-index: 1; margin-top: 4px; }

  h1 {
    margin: 0;
    font-size: 2.9rem;
    font-weight: 800;
    letter-spacing: -0.015em;
    line-height: 1.05;
    color: var(--ink);
    text-shadow: 0 1px 0 #fff, 0 6px 20px rgba(255,255,255,.8);
  }
  .sub {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 1.02rem;
    font-weight: 600;
  }

  /* ---------- Difficulty panel ---------- */
  .difficulty {
    margin: 24px auto 6px;
    max-width: 620px;
    padding: 14px 22px 16px;
    border-radius: 22px;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -10px 18px -10px rgba(30,140,220,.2),
      0 10px 20px -12px rgba(8,80,140,.4);
  }
  .diff-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .diff-header .label { font-size: .95rem; font-weight: 700; color: var(--ink-soft); }
  .diff-header .value { font-size: 1.2rem; font-weight: 800; color: var(--accent-ink); }

  /* Glossy slider: the filled part follows --p (0 to 1), set in JS */
  input[type="range"].diff-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 30px;
    margin: 0;
    background: transparent;
    cursor: pointer;
    --p: .25;
  }
  input[type="range"].diff-slider::-webkit-slider-runnable-track {
    height: 16px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo)) 0 0 / calc(14px + (100% - 28px) * var(--p)) 100% no-repeat,
      linear-gradient(180deg, rgba(10,70,120,.28), rgba(255,255,255,.7));
    box-shadow: inset 0 2px 4px rgba(5,50,90,.4), 0 1px 0 rgba(255,255,255,.95);
  }
  input[type="range"].diff-slider::-moz-range-track {
    height: 16px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo)) 0 0 / calc(14px + (100% - 28px) * var(--p)) 100% no-repeat,
      linear-gradient(180deg, rgba(10,70,120,.28), rgba(255,255,255,.7));
    box-shadow: inset 0 2px 4px rgba(5,50,90,.4), 0 1px 0 rgba(255,255,255,.95);
  }
  input[type="range"].diff-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 30px;
    height: 30px;
    margin-top: -7px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: linear-gradient(180deg, #fff 0%, #e3f4ff 48%, var(--accent-hi) 52%, #fff 100%);
    box-shadow: 0 4px 10px rgba(5,60,110,.4), inset 0 0 0 1px rgba(255,255,255,.9);
    cursor: pointer;
  }
  input[type="range"].diff-slider::-moz-range-thumb {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: linear-gradient(180deg, #fff 0%, #e3f4ff 48%, var(--accent-hi) 52%, #fff 100%);
    box-shadow: 0 4px 10px rgba(5,60,110,.4), inset 0 0 0 1px rgba(255,255,255,.9);
    cursor: pointer;
  }
  .diff-ticks {
    display: flex;
    justify-content: space-between;
    font-size: .82rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .diff-desc {
    margin-top: 10px;
    font-size: .95rem;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
    min-height: 1.3em;
  }

  /* ---------- Badge ---------- */
  .badge {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 22px;
    border-radius: 999px;
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    border: 1px solid color-mix(in srgb, var(--accent) 65%, #000);
    color: #fff;
    font-weight: 700;
    font-size: .95rem;
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
    box-shadow:
      0 8px 16px -8px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  /* ---------- Buttons ---------- */
  button {
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    padding: 11px 24px;
    border-radius: 999px;
    color: var(--ink);
    background: var(--gloss), linear-gradient(180deg, #ffffff, #cdeaff);
    border: 1px solid rgba(40,130,200,.55);
    box-shadow: 0 6px 12px -6px rgba(8,80,140,.55), inset 0 1px 0 #fff;
    cursor: pointer;
    user-select: none;
    transition: filter .15s, transform .1s, box-shadow .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.07) saturate(1.1); }
  button:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 2px 6px -3px rgba(8,80,140,.55), inset 0 2px 4px rgba(8,80,140,.2);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.primary {
    color: #fff;
    background: var(--gloss), linear-gradient(180deg, var(--accent), var(--accent-lo));
    border-color: color-mix(in srgb, var(--accent) 65%, #000);
    text-shadow: 0 1px 2px rgba(0,30,60,.55);
    box-shadow:
      0 8px 16px -8px color-mix(in srgb, var(--accent) 80%, #000),
      inset 0 1px 0 rgba(255,255,255,.7);
  }

  :is(button, input[type="range"]):focus-visible {
    outline: 3px solid var(--accent-ink);
    outline-offset: 3px;
  }

  /* ---------- Status / hints ---------- */
  .status {
    position: relative;
    margin-top: 20px;
    padding: 14px 20px 14px 52px;
    border-radius: 20px;
    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, 0 8px 18px -12px rgba(8,80,140,.5);
    min-height: 3.1em;
    line-height: 1.5;
    font-weight: 600;
    color: var(--ink);
    transition: background .4s;
  }
  .status::before {
    content: '';
    position: absolute;
    left: 18px; top: 50%;
    width: 20px; height: 20px;
    transform: translateY(-50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%),
      linear-gradient(180deg, var(--accent-hi), var(--accent-lo));
    box-shadow: 0 3px 8px -2px color-mix(in srgb, var(--accent) 80%, #000), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .status.win  { background: rgba(214,255,228,.8); }
  .status.lose { background: rgba(255,222,229,.82); }
  .status.win::before {
    background: radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%), linear-gradient(180deg, var(--correct-hi), var(--correct-lo));
  }
  .status.lose::before {
    background: radial-gradient(circle at 35% 28%, #fff 0 14%, rgba(255,255,255,0) 34%), linear-gradient(180deg, #ff8fa3, #d2284a);
  }
  .status a {
    color: var(--accent-ink);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .footer-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  /* ---------- Board ---------- */
  .board-panel {
    margin: 22px auto 0;
    max-width: 780px;
    padding: 18px 12px;
    border-radius: 22px;
    background: rgba(255,255,255,.5);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow:
      inset 0 1px 0 #fff,
      inset 0 -10px 18px -10px rgba(30,140,220,.2),
      0 10px 20px -12px rgba(8,80,140,.4);
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .board {
    --tile: 60px;
    --gap: 4px;
    --cols: 5;
    padding: calc(var(--tile) * .8) 0 calc(var(--tile) * 1.0);
  }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--tile));
    grid-auto-rows: var(--tile);
    gap: var(--gap);
  }

  .cell {
    position: relative;
    display: block;
    width: var(--tile);
    height: var(--tile);
    padding: 0;
    overflow: hidden;
    border-radius: calc(var(--tile) * .2);
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.5));
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 -4px 8px rgba(30,120,200,.16), 0 4px 9px -4px rgba(8,80,140,.45);
    cursor: pointer;
  }
  .cell.fixed { cursor: default; }
  .cell.locked {
    background: linear-gradient(180deg, rgba(238,245,251,.95), rgba(188,206,222,.72));
    cursor: not-allowed;
  }
  .cell.hole {
    cursor: default;
    background: radial-gradient(circle at 50% 38%, rgba(6,50,100,.58), rgba(6,60,120,.28));
    border: 1px solid rgba(255,255,255,.35);
    box-shadow: inset 0 6px 14px rgba(0,30,70,.55), inset 0 -2px 6px rgba(255,255,255,.25);
  }
  .cell.nope { animation: nope .25s; }
  @keyframes nope { 25% { translate: -3px 0; } 75% { translate: 3px 0; } }
  .board.busy .cell { cursor: progress; }

  .pipe {
    display: block;
    width: 100%;
    height: 100%;
    transition: transform .24s cubic-bezier(.3, 1.35, .5, 1);
  }
  .pipe g { fill: none; stroke-linecap: butt; }
  .pipe .edge  { stroke: var(--accent-lo); stroke-opacity: .6; stroke-width: 34; }
  .pipe .mid   { stroke: var(--accent-hi); stroke-opacity: .72; stroke-width: 26; }
  .pipe .shine { stroke: #fff; stroke-opacity: .85; stroke-width: 8; }
  .cell.locked .edge { stroke: #5d7487; }
  .cell.locked .mid  { stroke: #b4c5d3; }

  /* ---------- Solved-path glow (placed AFTER locked rules so it wins) ---------- */
  .cell.solved {
    background: linear-gradient(180deg, rgba(214,255,228,.95), rgba(150,240,180,.62));
    border-color: rgba(120,240,170,.95);
    box-shadow:
      0 0 18px 3px rgba(60,230,130,.75),
      0 0 34px 8px rgba(60,230,130,.32),
      inset 0 -4px 8px rgba(30,120,200,.16);
    animation: solvedPop .55s cubic-bezier(.34, 1.56, .64, 1);
    z-index: 2;
  }
  .cell.solved .pipe .edge  { stroke: var(--correct-lo); stroke-opacity: .85; }
  .cell.solved .pipe .mid   { stroke: var(--correct-hi); stroke-opacity: .95; }
  .cell.solved .pipe .shine { stroke: #fff; }
  .cell.solved .lock { background: rgba(220,255,235,.95); }
  @keyframes solvedPop {
    0%   { scale: 1; }
    45%  { scale: 1.18; }
    100% { scale: 1; }
  }

  .lock {
    position: absolute;
    right: 3px; bottom: 3px;
    width: 42%;
    max-width: 20px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    box-shadow: 0 1px 3px rgba(8,60,110,.35);
  }
  .lock svg { width: 68%; height: 68%; }

  .chute {
    position: absolute;
    left: calc(var(--tile) * .28);
    top: calc(var(--tile) * -.72);
    width: calc(var(--tile) * .44);
    height: calc(var(--tile) * .72);
    border-radius: 999px 999px 6px 6px / 14px 14px 6px 6px;
    background: linear-gradient(90deg, rgba(255,255,255,.92), rgba(255,255,255,.35) 50%, rgba(255,255,255,.85));
    border: 1px solid color-mix(in srgb, var(--accent) 55%, #fff);
    box-shadow: 0 6px 12px -6px rgba(8,80,140,.5), inset 0 -6px 10px -4px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .cup {
    position: absolute;
    top: calc(100% + 6px);
    width: calc(var(--tile) * .84);
    height: calc(var(--tile) * .62);
    border-radius: 6px 6px calc(var(--tile) * .34) calc(var(--tile) * .34);
    background: var(--gloss), linear-gradient(180deg, #8cf0b0, #1fae5a);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 0 22px 4px rgba(60,230,130,.5), inset 0 -6px 10px rgba(0,80,30,.25);
  }
  .cup.hit { animation: cupHit .6s; }
  @keyframes cupHit { 40% { scale: 1.18; box-shadow: 0 0 40px 12px rgba(60,230,130,.85), inset 0 -6px 10px rgba(0,80,30,.25); } }

  .marble {
    --m: 26px;
    position: absolute;
    left: 0; top: 0;
    width: var(--m);
    height: var(--m);
    display: none;
    z-index: 5;
    pointer-events: none;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.85);
    background:
      radial-gradient(circle at 32% 28%, #fff 0 10%, rgba(255,255,255,0) 30%),
      radial-gradient(circle at 50% 62%, var(--accent-hi), var(--accent) 55%, var(--accent-lo));
    box-shadow: 0 5px 9px rgba(5,60,110,.45), inset 0 -3px 6px rgba(255,255,255,.35);
  }

  /* ---------- Stats ---------- */
  .stats { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .stat {
    padding: 7px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,.66);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: inset 0 1px 0 #fff, 0 6px 12px -8px rgba(8,80,140,.5);
    font-weight: 800;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stat span { color: var(--ink-soft); font-weight: 700; margin-right: 8px; }

  @media (max-width: 620px) {
    .app { border-radius: 26px; }
    .window-body { padding: 22px 14px 24px; }
    .orb { width: 56px; height: 56px; font-size: 1.8rem; }
    h1 { font-size: 2.1rem; }
    .difficulty { padding: 12px 14px 14px; }
    .board-panel { padding: 14px 6px; }
    button { padding: 11px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { transition: none; }
    .bubble { animation: none; bottom: 0; transform: translateY(var(--ry, -40vh)); }
    .pipe, button, .status { transition: none; }
    .cell.nope, .cup.hit, .cell.solved { animation: none; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hill h1"></div>
  <div class="hill h2"></div>
  <span class="bubble" style="--x:7%;  --s:46px; --d:26s; --delay:-4s;  --ry:-30vh"></span>
  <span class="bubble" style="--x:19%; --s:20px; --d:19s; --delay:-12s; --ry:-62vh"></span>
  <span class="bubble" style="--x:34%; --s:62px; --d:32s; --delay:-20s; --ry:-48vh"></span>
  <span class="bubble" style="--x:58%; --s:28px; --d:22s; --delay:-8s;  --ry:-72vh"></span>
  <span class="bubble" style="--x:72%; --s:54px; --d:30s; --delay:-16s; --ry:-26vh"></span>
  <span class="bubble" style="--x:86%; --s:24px; --d:21s; --delay:-2s;  --ry:-56vh"></span>
  <span class="bubble" style="--x:93%; --s:38px; --d:27s; --delay:-23s; --ry:-38vh"></span>
</div>

<main class="app">
  <div class="window-body">
    <header>
      <div class="brand">
        <div class="orb"><span>M</span></div>
        <div class="brand-text">
          <h1>Marble Drop</h1>
          <div class="sub">Turn the tiles and guide the marble into the glowing cup</div>
        </div>
      </div>

      <div class="difficulty">
        <div class="diff-header">
          <span class="label">Difficulty</span>
          <span class="value" id="diffValue">Normal</span>
        </div>
        <input type="range" id="diffSlider" class="diff-slider" min="0" max="4" step="1" value="1" aria-label="Difficulty">
        <div class="diff-ticks">
          <span>Easy</span>
          <span>Normal</span>
          <span>Hard</span>
          <span>Extreme</span>
          <span>Insane</span>
        </div>
        <div class="diff-desc" id="diffDesc"></div>
      </div>

      <div class="badge" id="badge">Loading…</div>
    </header>

    <div class="board-panel" id="panel">
      <div class="board" id="board">
        <div class="grid" id="grid"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>Time</span><b id="timeEl">0:00</b></div>
      <div class="stat"><span>Marbles</span><b id="marblesEl">0</b></div>
    </div>

    <div class="footer-actions">
      <button id="dropBtn" class="primary">Drop marble</button>
      <button id="newBtn">New level</button>
    </div>

    <div class="status" id="status" aria-live="polite">Rotate the tiles to build a route, then drop a marble.</div>
  </div>
</main>

<script>
const DR = [-1, 0, 1, 0];   // sides: 0 top, 1 right, 2 bottom, 3 left
const DC = [0, 1, 0, -1];
const G = 4;                // gap between tiles (px)

const DIFFICULTIES = [
  { name: 'Easy',    rows: 5,  cols: 5,  holeRadii: [0.5],                   locked: 0,   pathLen: 11,  desc: 'Small grid, a tiny hole, short route' },
  { name: 'Normal',  rows: 6,  cols: 6,  holeRadii: [1, 0.5],                locked: 3,   pathLen: 16,  desc: 'Bigger grid, a few holes, a few locked tiles' },
  { name: 'Hard',    rows: 9,  cols: 9,  holeRadii: [2, 1.5, 1, 0.5],        locked: 15,  pathLen: 38,  desc: 'Huge grid, huge holes, very long route' },
  { name: 'Extreme', rows: 18, cols: 18, holeRadii: [3, 2, 1.5, 1, 0.5],     locked: 40,  pathLen: 90,  desc: 'Massive grid, sprawling holes, marathon route' },
  { name: 'Insane',  rows: 50, cols: 50, holeRadii: [6, 5, 4, 3, 2, 1],      locked: 150, pathLen: 220, desc: 'Gigantic 50×50 grid — a true marble marathon' },
];
const COLORS = ['#22b573', '#1e90e6', '#ee9a00', '#f0622a', '#e5365f'];

const diffSlider = document.getElementById('diffSlider');
const diffValue  = document.getElementById('diffValue');
const diffDesc   = document.getElementById('diffDesc');
const badge      = document.getElementById('badge');
const panel      = document.getElementById('panel');
const board      = document.getElementById('board');
const gridEl     = document.getElementById('grid');
const timeEl     = document.getElementById('timeEl');
const marblesEl  = document.getElementById('marblesEl');
const dropBtn    = document.getElementById('dropBtn');
const newBtn     = document.getElementById('newBtn');
const status     = document.getElementById('status');

const chute  = Object.assign(document.createElement('div'), { className: 'chute' });
const cup    = Object.assign(document.createElement('div'), { className: 'cup' });
const marble = Object.assign(document.createElement('div'), { className: 'marble' });

let level = null, T = 60, M = 26;
let busy = false, won = false, marbles = 0, runId = 0;
let solvedTimeouts = [];

/* ---------- helpers ---------- */
const rnd = n => Math.floor(Math.random() * n);
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

/* ---------- tile logic ---------- */
function openings(cell, rot) {
  if (cell.type === 'cross') return [0, 1, 2, 3];
  if (cell.type === 'straight') return rot % 2 === 0 ? [0, 2] : [1, 3];
  return [rot % 4, (rot + 1) % 4];            // curve: rot k joins sides k and k+1
}

// Follows a marble from the top of the start tile. Pure function of the board.
function simulate(lv, useSolution) {
  const { rows, cols, cells, target } = lv;
  const seen = new Set(), steps = [];
  let r = lv.start.r, c = lv.start.c, enter = 0;
  for (;;) {
    const cell = cells[r][c];
    const key = r + ',' + c + ',' + enter;
    if (seen.has(key)) return { steps, end: { kind: 'loop', r, c, enter } };
    seen.add(key);
    const open = openings(cell, useSolution ? cell.solRot : cell.rot);
    if (!open.includes(enter)) return { steps, end: { kind: 'blocked', r, c, enter } };
    const exit = cell.type === 'cross' ? (enter + 2) % 4 : open.find(s => s !== enter);
    steps.push({ r, c, enter, exit });
    const nr = r + DR[exit], nc = c + DC[exit];
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) {
      const win = exit === 2 && r === rows - 1 && c === target;
      return { steps, end: { kind: win ? 'win' : 'fall', r, c, exit } };
    }
    if (cells[nr][nc].hole) return { steps, end: { kind: 'hole', r: nr, c: nc, enter: (exit + 2) % 4 } };
    r = nr; c = nc; enter = (exit + 2) % 4;
  }
}

/* ---------- level generation ---------- */
function makeHoles(cfg, target, start) {
  const { rows, cols } = cfg;
  const holes = Array.from({ length: rows }, () => Array(cols).fill(false));
  for (const rad of cfg.holeRadii) {
    const cr = rnd(rows), cc = rnd(cols);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (Math.hypot(r - cr, c - cc) > rad) continue;
      if ((r === start.r && c === start.c) || (r === rows - 1 && c === target)) continue;
      holes[r][c] = true;
    }
  }
  return holes;
}

function reachable(holes, rows, cols, target, start) {
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
  const q = [[start.r, start.c]]; seen[start.r][start.c] = true;
  while (q.length) {
    const [r, c] = q.pop();
    for (let d = 0; d < 4; d++) {
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || holes[nr][nc] || seen[nr][nc]) continue;
      seen[nr][nc] = true; q.push([nr, nc]);
    }
  }
  return seen[rows - 1][target];
}

// Random depth-first maze; the tree path from start to goal is a winding route.
function treePath(holes, rows, cols, target, start) {
  const seen = Array.from({ length: rows }, () => Array(cols).fill(false));
  const parent = new Map(), stack = [[start.r, start.c]];
  seen[start.r][start.c] = true;
  while (stack.length) {
    const [r, c] = stack[stack.length - 1];
    const opts = [];
    for (let d = 0; d < 4; d++) {
      const nr = r + DR[d], nc = c + DC[d];
      if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || holes[nr][nc] || seen[nr][nc]) continue;
      opts.push([nr, nc]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nr, nc] = opts[rnd(opts.length)];
    seen[nr][nc] = true;
    parent.set(nr * cols + nc, r * cols + c);
    stack.push([nr, nc]);
  }
  const startKey = start.r * cols + start.c;
  const path = [];
  let cur = (rows - 1) * cols + target;
  while (cur !== startKey) { path.push([Math.floor(cur / cols), cur % cols]); cur = parent.get(cur); }
  path.push([start.r, start.c]);
  return path.reverse();
}

function dirBetween(a, b) {
  for (let d = 0; d < 4; d++) if (a[0] + DR[d] === b[0] && a[1] + DC[d] === b[1]) return d;
  return -1;
}

function assemble(cfg, holes, target, start, path) {
  const { rows, cols } = cfg;
  const cells = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => {
    const roll = Math.random();
    return {
      hole: holes[r][c], onPath: false, locked: false, deg: 0,
      type: roll < .45 ? 'curve' : roll < .8 ? 'straight' : 'cross',
      rot: rnd(4), solRot: 0,
    };
  }));

  // 1. Lay the guaranteed route.
  for (let i = 0; i < path.length; i++) {
    const [r, c] = path[i], cell = cells[r][c];
    const enter = i === 0 ? 0 : (dirBetween(path[i - 1], path[i]) + 2) % 4;
    const exit  = i === path.length - 1 ? 2 : dirBetween(path[i], path[i + 1]);
    if (enter === exit || exit < 0) return null;
    cell.onPath = true;
    if ((enter + 2) % 4 === exit) {
      cell.type = Math.random() < .22 ? 'cross' : 'straight';
      cell.solRot = cell.type === 'straight' ? (enter % 2 === 0 ? 0 : 1) : 0;
    } else {
      cell.type = 'curve';
      cell.solRot = (enter + 1) % 4 === exit ? enter : exit;
    }
    cell.rot = cell.solRot;
  }

  // 2. Lock some rotatable tiles (route tiles stay in their correct pose).
  const lockable = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cell = cells[r][c];
    if (!cell.hole && cell.type !== 'cross') lockable.push(cell);
  }
  for (let i = lockable.length - 1; i > 0; i--) { const j = rnd(i + 1); [lockable[i], lockable[j]] = [lockable[j], lockable[i]]; }
  lockable.slice(0, cfg.locked).forEach(cell => { cell.locked = true; });

  // 3. Scramble the unlocked route tiles so the board starts unsolved.
  const eligible = [];
  for (const [r, c] of path) {
    const cell = cells[r][c];
    if (!cell.locked && cell.type !== 'cross') eligible.push(cell);
  }
  if (eligible.length < 3) return null;
  const wrongize = cell => {
    cell.rot = cell.type === 'straight' ? cell.solRot ^ 1 : (cell.solRot + 1 + rnd(3)) % 4;
  };
  eligible.forEach(cell => { if (Math.random() < .88) wrongize(cell); });
  const isWrong = cell => openings(cell, cell.rot).join() !== openings(cell, cell.solRot).join()
    && !(cell.type === 'straight' && cell.rot % 2 === cell.solRot % 2);
  let wrong = eligible.filter(isWrong).length;
  for (const cell of eligible) {
    if (wrong >= Math.min(3, eligible.length)) break;
    if (!isWrong(cell)) { wrongize(cell); wrong++; }
  }
  cells.forEach(row => row.forEach(cell => { cell.deg = cell.rot * 90; }));

  let holeCells = 0, lockedCells = 0;
  cells.forEach(row => row.forEach(cell => { if (cell.hole) holeCells++; if (cell.locked) lockedCells++; }));
  const lv = { rows, cols, target, start, cells, path, holeCells, lockedCells, cfg };

  // 4. Guarantees: solvable, and not already solved.
  if (simulate(lv, true).end.kind !== 'win') return null;
  if (simulate(lv, false).end.kind === 'win') return null;
  return lv;
}

function generateLevel(cfg) {
  const { rows, cols } = cfg;
  const area = rows * cols;
  // Cap inner path samples for huge grids so generation stays snappy.
  const samples = Math.max(6, Math.min(40, Math.round(6000 / Math.max(1, area))));
  const attempts = area > 400 ? 120 : 400;
  for (let attempt = 0; attempt < attempts; attempt++) {
    const start  = { r: 0, c: rnd(cols) };   // random drop column
    const target = rnd(cols);
    const holes = attempt < Math.floor(attempts * 0.75)
      ? makeHoles(cfg, target, start)
      : Array.from({ length: rows }, () => Array(cols).fill(false));
    let hc = 0;
    holes.forEach(row => row.forEach(v => { if (v) hc++; }));
    if (hc > area * 0.4) continue;
    if (!reachable(holes, rows, cols, target, start)) continue;
    let best = null, bestDiff = Infinity;
    for (let k = 0; k < samples; k++) {
      const p = treePath(holes, rows, cols, target, start);
      const diff = Math.abs(p.length - cfg.pathLen) + Math.random() * .5;
      if (diff < bestDiff) { best = p; bestDiff = diff; }
    }
    const lv = assemble(cfg, holes, target, start, best);
    if (lv) return lv;
  }
  throw new Error('Could not generate a level');
}

/* ---------- rendering ---------- */
function pipeSvg(type) {
  const d = type === 'straight' ? '<path d="M50 0V100"/>'
          : type === 'curve'    ? '<path d="M50 0Q50 50 100 50"/>'
          : '<path d="M50 0V100"/><path d="M0 50H100"/>';
  return '<svg class="pipe" viewBox="0 0 100 100" aria-hidden="true"><g class="edge">' + d
    + '</g><g class="mid">' + d + '</g><g class="shine">' + d + '</g></svg>';
}
const LOCK_SVG = '<span class="lock"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" fill="#5d7487"/>'
  + '<path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="#5d7487" stroke-width="1.8"/></svg></span>';

function buildBoard() {
  const nodes = [];
  level.cells.forEach((row, r) => row.forEach((cell, c) => {
    let el;
    if (cell.hole) {
      el = document.createElement('div');
      el.className = 'cell hole';
    } else {
      el = document.createElement('button');
      el.className = 'cell' + (cell.locked ? ' locked' : '') + (cell.type === 'cross' ? ' fixed' : '');
      el.dataset.r = r; el.dataset.c = c;
      el.setAttribute('aria-label', 'Row ' + (r + 1) + ', column ' + (c + 1) + ', ' + cell.type
        + (cell.locked ? ', locked' : cell.type === 'cross' ? ', fixed' : ', tap to rotate'));
      el.innerHTML = pipeSvg(cell.type) + (cell.locked ? LOCK_SVG : '');
      if (cell.type !== 'cross') el.firstChild.style.transform = 'rotate(' + cell.deg + 'deg)';
    }
    cell.el = el;
    nodes.push(el);
  }));
  board.style.setProperty('--cols', level.cols);
  board.style.setProperty('--gap', G + 'px');
  gridEl.replaceChildren(...nodes, chute, cup, marble);
  fit();
}

function fit() {
  if (!level) return;
  const avail = panel.clientWidth - 24;
  // Allow very small tiles for huge grids so the whole board still fits.
  T = Math.max(8, Math.min(64, Math.floor((avail - (level.cols - 1) * G) / level.cols)));
  M = Math.max(3, Math.round(T * .46));
  board.style.setProperty('--tile', T + 'px');
  marble.style.setProperty('--m', M + 'px');
  chute.style.left = (level.start.c * (T + G) + T * .28) + 'px';
  cup.style.left = (level.target * (T + G) + T * .08) + 'px';
}
window.addEventListener('resize', () => { if (!busy) fit(); });

/* ---------- clock ---------- */
let startAt = null, timerId = null;
function startClock() {
  if (startAt !== null) return;
  startAt = performance.now();
  timerId = setInterval(() => { timeEl.textContent = fmt(performance.now() - startAt); }, 200);
}
function stopClock() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (startAt !== null) timeEl.textContent = fmt(performance.now() - startAt);
}
function resetClock() {
  if (timerId) clearInterval(timerId);
  timerId = null; startAt = null; timeEl.textContent = '0:00';
}

/* ---------- difficulty ---------- */
function previewDifficulty(idx) {
  const d = DIFFICULTIES[idx];
  diffValue.textContent = d.name;
  diffDesc.textContent = d.desc;
  diffSlider.style.setProperty('--p', idx / (DIFFICULTIES.length - 1));
  document.documentElement.style.setProperty('--accent', COLORS[idx]);
}

/* ---------- play ---------- */
function newLevel() {
  runId++;
  busy = false; won = false; marbles = 0;
  solvedTimeouts.forEach(clearTimeout);
  solvedTimeouts = [];
  marble.style.display = 'none';
  board.classList.remove('busy');
  resetClock();
  marblesEl.textContent = '0';
  const idx = +diffSlider.value;
  previewDifficulty(idx);
  level = generateLevel(DIFFICULTIES[idx]);
  buildBoard();
  badge.textContent = level.cols + ' × ' + level.rows + ' grid, ' + level.holeCells + (level.holeCells === 1 ? ' hole, ' : ' holes, ') + level.lockedCells + ' locked';
  dropBtn.disabled = false;
  newBtn.classList.remove('primary');
  status.className = 'status';
  status.textContent = 'Rotate the tiles to build a route, then drop a marble.';
}

gridEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button.cell');
  if (!btn || !level || busy || won) return;
  const cell = level.cells[+btn.dataset.r][+btn.dataset.c];
  if (cell.locked || cell.type === 'cross') {
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    return;
  }
  startClock();
  cell.rot = (cell.rot + 1) % 4;
  cell.deg += 90;
  btn.firstChild.style.transform = 'rotate(' + cell.deg + 'deg)';
});

function buildRoute(sim) {
  const P = T + G, pts = [];
  const center = (r, c) => ({ x: c * P + T / 2, y: r * P + T / 2 });
  const edge = (r, c, s) => {
    const o = center(r, c), h = T / 2;
    return { x: o.x + DC[s] * h, y: o.y + DR[s] * h };
  };
  pts.push({ x: level.start.c * P + T / 2, y: -T * .5 });
  for (const s of sim.steps) {
    const A = edge(s.r, s.c, s.enter), C = center(s.r, s.c), B = edge(s.r, s.c, s.exit);
    for (let i = 0; i <= 10; i++) {
      const t = i / 10, u = 1 - t;
      pts.push({ x: u * u * A.x + 2 * u * t * C.x + t * t * B.x, y: u * u * A.y + 2 * u * t * C.y + t * t * B.y });
    }
  }
  const end = sim.end, last = sim.steps[sim.steps.length - 1];
  const gridH = level.rows * T + (level.rows - 1) * G;
  if (end.kind === 'win') {
    pts.push({ x: last.c * P + T / 2, y: gridH + 6 + T * .62 * .45 });
  } else if (end.kind === 'fall') {
    const e = edge(last.r, last.c, last.exit);
    pts.push({ x: e.x + DC[last.exit] * T * .9, y: e.y + DR[last.exit] * T * .9 });
  } else if (end.kind === 'hole') {
    pts.push(edge(end.r, end.c, end.enter), center(end.r, end.c));
  } else {
    pts.push(edge(end.r, end.c, end.enter));
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, cum, total: cum[cum.length - 1] };
}

function place(x, y) { marble.style.translate = (x - M / 2) + 'px ' + (y - M / 2) + 'px'; }

function dropMarble() {
  if (!level || busy || won) return;
  startClock();
  marbles++;
  marblesEl.textContent = marbles;
  busy = true;
  board.classList.add('busy');
  dropBtn.disabled = true;
  status.className = 'status';
  status.textContent = 'Rolling…';

  const sim = simulate(level, false);
  const { pts, cum, total } = buildRoute(sim);
  const id = ++runId;
  const dur = Math.max(500, Math.min(7000, total / (T / 200)));

  marble.style.transition = 'none';
  marble.style.opacity = '1';
  marble.style.scale = '1';
  marble.style.display = 'block';
  place(pts[0].x, pts[0].y);

  const t0 = performance.now();
  let seg = 1;
  function frame(now) {
    if (id !== runId) return;
    const t = Math.min(1, (now - t0) / dur), d = t * total;
    while (seg < cum.length - 1 && cum[seg] < d) seg++;
    const a = pts[seg - 1], b = pts[seg];
    const u = Math.min(1, Math.max(0, (d - cum[seg - 1]) / ((cum[seg] - cum[seg - 1]) || 1)));
    place(a.x + (b.x - a.x) * u, a.y + (b.y - a.y) * u);
    if (t < 1) requestAnimationFrame(frame); else endEffect(sim.end.kind, id);
  }
  requestAnimationFrame(frame);
}

function endEffect(kind, id) {
  marble.style.transition = 'scale .3s ease, opacity .3s ease';
  marble.style.scale = kind === 'win' ? '.6' : kind === 'hole' ? '0' : kind === 'fall' ? '.8' : '1.8';
  marble.style.opacity = '0';
  setTimeout(() => { if (id === runId) finishRun(kind); }, 330);
}

const MESSAGES = {
  blocked: 'The marble hit a closed end. Rotate some tiles and try again.',
  fall: 'The marble rolled off the edge of the board.',
  hole: 'The marble dropped into a hole.',
  loop: 'The marble went around in circles.',
};

function lightUpPath(path) {
  // Stagger the glow so long paths cascade instead of popping all at once.
  const perTile = Math.max(10, Math.min(55, Math.floor(1400 / Math.max(1, path.length))));
  path.forEach(([r, c], i) => {
    const t = setTimeout(() => {
      const cell = level.cells[r] && level.cells[r][c];
      if (cell && cell.el) cell.el.classList.add('solved');
    }, i * perTile);
    solvedTimeouts.push(t);
  });
}

function finishRun(kind) {
  marble.style.display = 'none';
  busy = false;
  board.classList.remove('busy');
  if (kind === 'win') {
    won = true;
    stopClock();
    cup.classList.remove('hit'); void cup.offsetWidth; cup.classList.add('hit');
    status.className = 'status win';
    status.textContent = 'Solved in ' + timeEl.textContent + ' using ' + marbles + (marbles === 1 ? ' marble!' : ' marbles!');
    newBtn.classList.add('primary');
    if (level && level.path) lightUpPath(level.path);
  } else {
    status.className = 'status lose';
    status.textContent = MESSAGES[kind];
    dropBtn.disabled = false;
  }
}

diffSlider.addEventListener('input', () => previewDifficulty(+diffSlider.value));
diffSlider.addEventListener('change', newLevel);
dropBtn.addEventListener('click', dropMarble);
newBtn.addEventListener('click', newLevel);

newLevel();
</script>
</body>
</html>
